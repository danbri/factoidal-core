<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <title>One pod, three agents, one read-only WebDAV front end (0.21.0)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="860" height="470" fill="#ffffff"/>

  <!-- Mac -->
  <rect x="16" y="40" width="190" height="390" rx="10" fill="#f4f6f8" stroke="#8a96a3"/>
  <text x="111" y="62" text-anchor="middle" font-weight="700">Your Mac (user danbri)</text>
  <rect x="34" y="84" width="154" height="86" rx="6" fill="#fff" stroke="#8a96a3"/>
  <text x="111" y="106" text-anchor="middle" font-weight="600">Finder / mount_webdav</text>
  <text x="111" y="125" text-anchor="middle" fill="#555">Registered User: a login</text>
  <text x="111" y="142" text-anchor="middle" fill="#555">Guest: the --guest user</text>
  <text x="111" y="159" text-anchor="middle" fill="#555">mounted read only</text>
  <rect x="34" y="186" width="154" height="70" rx="6" fill="#fff" stroke="#8a96a3"/>
  <text x="111" y="208" text-anchor="middle" font-weight="600">curl, scripts</text>
  <text x="111" y="227" text-anchor="middle" fill="#555">curl -u NAME:PASSWORD</text>
  <text x="111" y="244" text-anchor="middle" fill="#555">reads only</text>
  <rect x="34" y="330" width="154" height="80" rx="6" fill="#fff" stroke="#3f9a55"/>
  <text x="111" y="352" text-anchor="middle" font-weight="600">bot1 process</text>
  <text x="111" y="371" text-anchor="middle" fill="#555">LWS client with</text>
  <text x="111" y="388" text-anchor="middle" fill="#555">danbri1_bot1.jwk</text>
  <text x="111" y="404" text-anchor="middle" fill="#555">reads and writes</text>

  <!-- webdav-serve -->
  <rect x="270" y="40" width="250" height="280" rx="10" fill="#eef5ff" stroke="#4a7bd0"/>
  <text x="395" y="60" text-anchor="middle" font-weight="700">webdav-serve dav --port 8093</text>
  <text x="395" y="77" text-anchor="middle" fill="#2c4f8c">--users users.txt --guest guest · read only</text>
  <g>
    <rect x="290" y="88" width="210" height="64" rx="6" fill="#fff" stroke="#4a7bd0"/>
    <text x="300" y="106" font-weight="600">/danbri1/</text>
    <text x="300" y="124" fill="#555">users: danbri1</text>
    <text x="300" y="142" fill="#555">signs as key danbri1.jwk</text>
  </g>
  <g>
    <rect x="290" y="160" width="210" height="64" rx="6" fill="#fff" stroke="#4a7bd0"/>
    <text x="300" y="178" font-weight="600">/danbri1_bot1/</text>
    <text x="300" y="196" fill="#555">users: danbri1_bot1</text>
    <text x="300" y="214" fill="#555">signs as key danbri1_bot1.jwk</text>
  </g>
  <g>
    <rect x="290" y="232" width="210" height="64" rx="6" fill="#fff" stroke="#4a7bd0"/>
    <text x="300" y="250" font-weight="600">/danbri1_bot2/</text>
    <text x="300" y="268" fill="#555">users: danbri1_bot2</text>
    <text x="300" y="286" fill="#555">signs as key danbri1_bot2.jwk</text>
  </g>
  <text x="395" y="312" text-anchor="middle" fill="#2c4f8c" font-size="12">other user: 404 · any write: 403</text>

  <!-- pod -->
  <rect x="584" y="40" width="260" height="390" rx="10" fill="#eefaf0" stroke="#3f9a55"/>
  <text x="714" y="62" text-anchor="middle" font-weight="700">lws-serve danbri1-pod --port 8083</text>
  <rect x="602" y="80" width="224" height="90" rx="6" fill="#fff" stroke="#3f9a55"/>
  <text x="714" y="101" text-anchor="middle" font-weight="600">authorization server (--authz)</text>
  <text x="714" y="121" text-anchor="middle" fill="#555">checks a self-signed did:key JWT,</text>
  <text x="714" y="139" text-anchor="middle" fill="#555">gives an access token for this pod</text>
  <text x="714" y="157" text-anchor="middle" fill="#555">(RFC 8693 token exchange)</text>
  <rect x="602" y="182" width="224" height="104" rx="6" fill="#fff" stroke="#3f9a55"/>
  <text x="714" y="203" text-anchor="middle" font-weight="600">root ACL (Web Access Control)</text>
  <text x="614" y="225">danbri1: Read, Write, Control</text>
  <text x="614" y="245">danbri1_bot1: Read, Write</text>
  <text x="614" y="265">danbri1_bot2: Read</text>
  <text x="614" y="281" fill="#555" font-size="11">anyone else: 401</text>
  <rect x="602" y="298" width="224" height="64" rx="6" fill="#fff" stroke="#3f9a55"/>
  <text x="714" y="319" text-anchor="middle" font-weight="600">storage (--storage files)</text>
  <text x="714" y="339" text-anchor="middle" fill="#555">danbri1-pod/: lws-files.json,</text>
  <text x="714" y="355" text-anchor="middle" fill="#555">lws-journal, bodies/</text>
  <text x="714" y="400" text-anchor="middle" fill="#2d6e3d">decides every access</text>

  <!-- arrows -->
  <line x1="188" y1="127" x2="288" y2="120" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="188" y1="221" x2="288" y2="192" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="188" y1="236" x2="288" y2="264" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="238" y="96" text-anchor="middle" fill="#444" font-size="11">WebDAV</text>
  <line x1="500" y1="120" x2="600" y2="226" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="500" y1="192" x2="600" y2="234" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="500" y1="264" x2="600" y2="242" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="552" y="96" text-anchor="middle" fill="#444" font-size="11">LWS reads</text>
  <text x="552" y="110" text-anchor="middle" fill="#444" font-size="11">+ Bearer token</text>
  <line x1="188" y1="370" x2="600" y2="330" stroke="#3f9a55" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="395" y="386" text-anchor="middle" fill="#2d6e3d" font-size="12">LWS reads and writes + Bearer token (no WebDAV)</text>
  <text x="430" y="456" text-anchor="middle" fill="#555" font-size="12">Everything runs on 127.0.0.1. Paths are relative to ~/tmp/pods. @factoidal/core 0.21.0.</text>
</svg>
