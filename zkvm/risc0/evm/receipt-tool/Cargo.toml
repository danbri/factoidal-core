[package]
name = "factoidal-evm-receipt"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.103"
bincode = "=1.3.3"
hex = "=0.4.3"
serde_json = "=1.0.150"
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std", "client", "disable-dev-mode"] }
risc0-groth16 = { version = "=3.0.6", default-features = false, features = ["std", "prove"] }
risc0-zkp = { version = "=3.0.6", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
