[package]
name = "factoidal-ask-guest"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std"] }
risc0-zkvm-platform = { version = "=2.2.3", default-features = false }

[build-dependencies]
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
panic = "abort"
lto = true

