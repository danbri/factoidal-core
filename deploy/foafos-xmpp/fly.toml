# fly deploy --remote-only --ha=false   (from this directory)
app = "foafos-xmpp"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build.args]
  FACTOIDAL_VERSION = "0.32.0"
  FACTOIDAL_HOST_COMMIT = "a9caa45d874772b86660a87ac97eb5ec3eb6ca96"
  FOAFOS_POD_COMMIT = "1bd3dbf612ed5b12a16e31f33d68eee272e8f17b"

[env]
  XMPP_DOMAIN = "foafos-xmpp.fly.dev"
  XMPP_EXTRA_ARGS = ""

[mounts]
  source = "foafos_xmpp_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"

# Every service is raw TCP: Fly does not terminate TLS, the machine does.
[[services]]
  internal_port = 5223
  protocol = "tcp"
  auto_stop_machines = "off"
  min_machines_running = 1
  [services.concurrency]
    type = "connections"
    hard_limit = 256
    soft_limit = 200
  [[services.ports]]
    port = 5223
  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"

[[services]]
  internal_port = 5222
  protocol = "tcp"
  auto_stop_machines = "off"
  min_machines_running = 1
  [services.concurrency]
    type = "connections"
    hard_limit = 256
    soft_limit = 200
  [[services.ports]]
    port = 5222

[[services]]
  internal_port = 5281
  protocol = "tcp"
  auto_stop_machines = "off"
  min_machines_running = 1
  [services.concurrency]
    type = "connections"
    hard_limit = 256
    soft_limit = 200
  [[services.ports]]
    port = 443

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  min_machines_running = 1
  [[services.ports]]
    port = 80

# The LWS pod over HTTPS. Unlike the services above, Fly terminates TLS here;
# Caddy holds the bearer token behind it.
[[services]]
  internal_port = 8090
  protocol = "tcp"
  auto_stop_machines = "off"
  min_machines_running = 1
  [[services.ports]]
    port = 8443
    handlers = ["tls", "http"]
  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"
    method = "get"
    path = "/healthz"
