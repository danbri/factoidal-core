services:
  replica:
    build:
      context: .
      args:
        FACTOIDAL_VERSION: ${FACTOIDAL_VERSION:?Resolve the npm version before building}
    init: true
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      PUBLIC_ORIGIN: "https://${DOMAIN:?Set DOMAIN}"
      SITE_ADDRESS: "${DOMAIN:?Set DOMAIN}"
      WRITER_SUBJECT: "${WRITER_SUBJECT:?Set WRITER_SUBJECT}"
    volumes:
      - state:/data
      - caddy_config:/config
      - ./writer.jwks.json:/run/config/writer.jwks.json:ro
      - ./public:/srv/site:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  state:
  caddy_config:
