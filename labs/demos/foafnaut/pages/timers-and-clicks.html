<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Timers and clicks</title>
<style>
body{margin:0;padding:16px;font-size:15px;line-height:22px;color:#22303c;background:#f3f1f8}
main{max-width:640px;margin:0 auto}
h1{margin:0;font-size:26px;line-height:34px;color:#4a2f8a;text-align:center}
p{margin:0;padding-top:6px}
.lede{text-align:center;color:#5d5a6b}
.stage{margin-top:14px;padding:12px 0;background:white;border:1px solid #d9d3e8}
svg{display:block;margin:0 auto}
.controls{text-align:center;padding-top:12px}
button{font-size:15px}
.out{text-align:center;color:#4a2f8a;font-size:17px;line-height:26px;padding-top:8px}
</style></head><body><main>
<p><a href="index.html">Demo index</a></p>
<h1>Timers and clicks</h1>
<p class="lede">Twelve dots, three layouts. The script runs inside the Lean engine: in BubblePopJS in the desktop app, in QuickJS-NG in WasmVM on the Hub.</p>
<div class="stage">
<svg width="340" height="340" viewBox="0 0 340 340">
<g id="dots">
<circle id="d0" r="1" fill="#7a5cb8" transform="translate(70 70) scale(0.1) scale(160)"/><circle id="d1" r="1" fill="#7a5cb8" transform="translate(137 70) scale(0.1) scale(160)"/>
<circle id="d2" r="1" fill="#7a5cb8" transform="translate(203 70) scale(0.1) scale(160)"/><circle id="d3" r="1" fill="#7a5cb8" transform="translate(270 70) scale(0.1) scale(160)"/>
<circle id="d4" r="1" fill="#7a5cb8" transform="translate(70 170) scale(0.1) scale(160)"/><circle id="d5" r="1" fill="#7a5cb8" transform="translate(137 170) scale(0.1) scale(160)"/>
<circle id="d6" r="1" fill="#7a5cb8" transform="translate(203 170) scale(0.1) scale(160)"/><circle id="d7" r="1" fill="#7a5cb8" transform="translate(270 170) scale(0.1) scale(160)"/>
<circle id="d8" r="1" fill="#7a5cb8" transform="translate(70 270) scale(0.1) scale(160)"/><circle id="d9" r="1" fill="#7a5cb8" transform="translate(137 270) scale(0.1) scale(160)"/>
<circle id="d10" r="1" fill="#7a5cb8" transform="translate(203 270) scale(0.1) scale(160)"/><circle id="d11" r="1" fill="#7a5cb8" transform="translate(270 270) scale(0.1) scale(160)"/>
</g>
</svg>
<p class="controls"><button id="grid">Grid</button> <button id="ring">Ring</button> <button id="bars">Bars</button> <button id="auto">Pause</button></p>
<p class="out" id="state">Grid</p>
</div>
<script>
// Each dot eases from where it is to where the next layout puts it, one animation frame at
// a time, as a d3 transition does. A frame writes one transform per dot; colours change
// once, when a transition starts.
const N = 12, dots = Array.from({length: N}, (_, i) => document.getElementById('d' + i));
const hues = ['#7a5cb8', '#5c7ab8', '#3f9d8b', '#c4455a', '#e08a2e', '#4a2f8a'];
const heights = [5, 9, 4, 11, 7, 3, 10, 6, 8, 2, 12, 1];
const layouts = {
  grid: i => ({x: 70 + (i % 4) * 66.7, y: 70 + Math.floor(i / 4) * 100, r: 16, fill: '#7a5cb8'}),
  ring: i => {const a = i / N * 2 * Math.PI - Math.PI / 2;
              return {x: 170 + 120 * Math.cos(a), y: 170 + 120 * Math.sin(a), r: 12 + (i % 3) * 5, fill: hues[i % 6]};},
  bars: i => ({x: 30 + i * 25.5, y: 300 - heights[i] * 22, r: 10, fill: hues[heights[i] % 6]})
};
const order = ['grid', 'ring', 'bars'];
let now = dots.map((_, i) => layouts.grid(i)), current = 'grid', auto = true, running = 0;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
// Whole numbers only: a transform is the dot's centre and ten times its radius.
const place = (el, x, y, r) =>
  el.setAttribute('transform', 'translate(' + (x + 0.5 | 0) + ' ' + (y + 0.5 | 0) + ') scale(0.1) scale(' + (r * 10 + 0.5 | 0) + ')');
function go(name) {
  current = name;
  document.getElementById('state').textContent = name[0].toUpperCase() + name.slice(1);
  const from = now.map(d => ({...d})), to = dots.map((_, i) => layouts[name](i)), mine = ++running;
  for (let i = 0; i < N; i++) dots[i].setAttribute('fill', to[i].fill);
  let start;
  const frame = t => {
    if (mine !== running) return;
    if (start === undefined) start = t;
    const k = ease(Math.min(1, (t - start) / 900));
    for (let i = 0; i < N; i++) {
      const a = from[i], b = to[i], d = now[i];
      d.x = a.x + (b.x - a.x) * k; d.y = a.y + (b.y - a.y) * k; d.r = a.r + (b.r - a.r) * k;
      place(dots[i], d.x, d.y, d.r);
    }
    if (k < 1) requestAnimationFrame(frame); else running = 0;
  };
  requestAnimationFrame(frame);
}
const label = () => { document.getElementById('auto').textContent = auto ? 'Pause' : 'Play'; };
for (const name of order) document.getElementById(name).addEventListener('click', () => { auto = false; label(); go(name); });
document.getElementById('auto').addEventListener('click', () => { auto = !auto; label(); });
setInterval(() => { if (auto && !running) go(order[(order.indexOf(current) + 1) % order.length]); }, 2600);
</script>
</main></body></html>
