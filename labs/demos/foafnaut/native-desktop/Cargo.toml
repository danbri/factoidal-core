[package]
name = "foafnaut-native-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = "0.2"
serde_json = "1"

pollster = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
wgpu = { version = "28", default-features = false, features = ["std", "metal", "vulkan", "wgsl"] }
