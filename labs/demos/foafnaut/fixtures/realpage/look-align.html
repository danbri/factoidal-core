<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Old alignment markup</title>
<style>body{font:16px sans-serif;margin:16px} table{border:1px solid #888} td{border:1px solid #ccc;padding:2px 6px}</style></head>
<body>
<h1>Old alignment markup</h1>
<center><table width="60%"><tr><td>A table inside <code>center</code> sits in the middle</td></tr></table></center>
<table align="center" style="margin-top:8px"><tr><td>A table with <code>align=center</code> sits in the middle</td></tr></table>
<div align="center"><div style="width:240px;background:#def">A block in <code>div align=center</code></div></div>
<p align="right">A paragraph with <code>align=right</code></p>
<table width="100%"><tr><td align="right">a cell with align=right</td><td align="center">align=center</td><td>no align</td></tr></table>
<p>Water is H<sub>2</sub>O; Einstein wrote E = mc<sup>2</sup>; a footnote mark sits up high.<sup>[1]</sup></p>
</body></html>
