<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Icons from drawing programs</title>
<style>body{font:16px sans-serif;margin:16px} svg{vertical-align:middle;margin-right:8px}</style></head>
<body>
<h1>Icons from drawing programs</h1>
<p><svg width="48" height="48" viewBox="0 0 48 48"><path d="M4 4h40v40H4z M1.13686838e-13 3.55271368e-15" fill="#b80000"/><path d="M12 12h24v24H12z" fill="#fff"/></svg>
A drawing with round-off numbers such as 1.13686838e-13 (a red square with a white square inside).</p>
<p><svg width="48" height="48" viewBox="0 0 16 16"><path fill-rule="evenodd" clip-rule="evenodd" d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zm0 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" fill="#1f6feb"/></svg>
An icon with <code>clip-rule</code> on its path (a blue ring).</p>
<p><svg width="48" height="48" viewBox="0 0 48 48"><defs><clipPath id="frame"><path fill="#fff" d="M0 0h48v24H0z"/></clipPath></defs><g clip-path="url(#frame)"><circle cx="24" cy="24" r="20" fill="#2e7d32"/></g></svg>
A drawing exported with a rectangular clip path (the top half of a green disc).</p>
</body></html>
