# The Factoidal FOUNDATION manifest — VERSION 0, TO BE REFINED BY EXPERTS.
#
# https://github.com/danbri/factoidal/issues/975, "Architecture acceptance",
# item 1. This file names the Lean modules (formal/lean4/L4Factoidal/) that
# ARE the specification layer. Every other L4Factoidal module is an
# implementation (stores, indexes, planners, codecs, fast paths, wasm ops,
# harnesses) or a proof about one. `tools/foundation-gate.py` checks that no
# module listed here imports an implementation module, and that no level-k
# module imports a module of a higher level. Today's exceptions are in
# `foundation/allow-imports.txt`, one reason each; that list may only shrink.
#
# Owner steer, 2026-10-24, verbatim:
#
#   "For the FOUNDATION we'll need to iterate as I work out collaborations
#   around W3C so for now just go with your instincts and knowledge of the
#   lean codebase" ... "Let's call a FOUNDATION LEVEL 0 te RDF/S model with
#   named graphs and URIs/IRIs / LEVEL 1 OWL SPARQL ... more / LEVEL 2 XML and
#   non-XML syntaxes, JSON, ... / LEVEL 3 CSVW RML JSON-LD ... Something like
#   that, the details matter less than that we can do it, and that the human
#   experts can refine it later."
#
# He also listed: RDF, RDFS, SPARQL and its extensibility (text, geo, wasm
# functions), OWL (DL, RL, ...), RIF (maybe inessential), URIs/IRIs/URLs,
# enough XML for the semweb specs' uses of XML, and the XPath functions and
# operators.
#
# The module choice and the citations below are a Claude-inferred version 0
# made by reading the Lean sources on 2026-10-24. They are not owner
# decisions. Section numbers cite the W3C Recommendation (or the IETF / OGC
# document) the module transcribes.

[manifest]
version = 0
status = "version 0, to be refined by experts"
source_root = "formal/lean4"
issue = "https://github.com/danbri/factoidal/issues/975"

[levels]
0 = "RDF and RDFS model: terms, IRIs, literals and the XSD datatypes RDF uses, graphs, datasets with named graphs, RDF Semantics and entailment"
1 = "SPARQL 1.1 (algebra, semantics, update, entailment regimes, extension functions), XPath functions and operators, OWL 2, RIF, SHACL, ShEx, RDFC-1.0, the evidence and contract types"
2 = "Concrete syntaxes: XML and XPath 1.0, JSON, the RDF syntaxes, the SPARQL grammar and result formats, the OWL / RIF / ShEx syntaxes"
3 = "Mapping languages built on levels 0 to 2: CSVW, RML, JSON-LD"

