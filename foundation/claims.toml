]

[[claim]]
id = "backend-bgp-refinement"
theorem = "L4Factoidal.Storage.BackendRefinement.evalBgpBackend_solEquiv"
file = "formal/lean4/L4Factoidal/Storage/BackendRefinement.lean"
about = "evalBgpBackend, BGP evaluation through any exact GraphBackend (indexes, stores)"
says = """For any backend that answers triple patterns exactly for a graph g with no repeated keys, BGP evaluation through the backend gives the same solutions as the reference evalBgp over g, up to order."""
does_not_say = """It does not say a particular on-disk store is exact: that is the BackendExact premise, proved per backend or named as an assumption (foundation/assumptions.txt)."""
assumptions = [
  "hx: the backend is exact for G",
  "hg: g has no repeated keys",
  "hG: G is membership in g",
]
status = "proposed"
statement_sha256 = "6e4a2ea83e696886a6928f25caf6e6e65811d244ded6ecdde7224f5b18eaf011"
spec_defs = [
  { name = "L4Factoidal.SPARQL.StoreBackend.BackendExact", file = "formal/lean4/L4Factoidal/SPARQL/StoreBackendDenotation.lean", sha256 = "6d46f506d765c79a3cd319ce22a7b8cb2768ca2f1bfcb021804c57819ddad2ab" },
]

