[[claim]]
id = "capability-planner-sound"
theorem = "L4Factoidal.Planner.search_sound"
file = "formal/lean4/L4Factoidal/Planner/Search.lean"
about = "Planner.search, the capability-aware planner"
says = """For a catalog whose exact sources are sound, every exact row of every plan the search returns is, up to binding equality, an answer of the requirement over the catalog's declared graph."""
does_not_say = """Rows marked approximate are not covered. It does not say the search finds the best plan, or any plan. Source soundness is a premise per source."""
assumptions = ["hsound: every source declared exact is sound"]
