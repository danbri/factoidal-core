# The Factoidal CLAIMS register.
#
# https://github.com/danbri/factoidal-core/issues/1178 (P1, claims register) and
# https://github.com/danbri/factoidal-core/issues/1179 (P2, statement freeze).
# Batch: https://github.com/danbri/factoidal-core/issues/1189.
# Reason: docs/designissues/2026-11-27-formal-verification-post-review.md.
#
# Owner, 2026-11-27, verbatim: "Approve, start P1".
#
# Rules:
#   * A release note, a hub page or a README may say "proved" only for an entry
#     here, and must give its assumptions and its "does not say" with it.
#   * The owner reviews this file. Nobody needs to review the proofs: Lean checks
#     them, and CI checks that each claim uses only the axioms propext,
#     Classical.choice and Quot.sound (tools/claims-gate.py --check-axioms).
#   * status = "proposed" until the owner reviews an entry; then
#     status = "reviewed" and `reviewed` gives who, the date and the words.
#   * statement_sha256 freezes the statement; each spec_defs sha256 freezes a
#     definition the statement uses. tools/claims-gate.py fails when one
#     changes and the register does not change in the same commit. A frozen
#     definition's text is frozen, not the definitions it calls in turn.
#   * Every entry with hypotheses gets a `witness` (P3,
#     https://github.com/danbri/factoidal-core/issues/1180): an `example` that
#     satisfies all the hypotheses at once.
#
# The entries below, their "says", "does_not_say" and assumptions are a Claude
# session's reading of the Lean sources on 2026-11-27. They are not owner
# decisions.

[meta]
max-entries = 50

[[claim]]
id = "sparql-eval-lawful-dataset"
theorem = "L4Factoidal.Dataflow.query_sound"
file = "formal/lean4/L4Factoidal/Dataflow/Compose.lean"
about = "LawfulEvaluator.run on queryInput, for any LawfulDataset (store) and any lawful evaluator"
says = """For a store with a lawful dataset S and a lawful evaluator, the answer to any SPARQL query satisfies EvalContract: it is the SPARQL 1.1 reference answer of the foundation (referenceAnswer), or, on the backend path for SELECT and ASK, an answer that SPARQL 1.1 section 18.5 allows and that equals the reference WHERE answer up to the order of solutions. When the solution modifiers do not read the order (OrderFree), the answer equals the reference answer up to row order."""
does_not_say = """It does not say that the Lean definition referenceAnswer is SPARQL 1.1: that is a fidelity question for the W3C suites (P6, https://github.com/danbri/factoidal-core/issues/1183). It does not cover any particular store until its assumptions are discharged; it says nothing about time or memory."""
assumptions = [
  "hev: the evaluator's named assumption (LawfulEvaluator.assumed_contractOn, foundation/assumptions.txt)",
  "hS: the store's named assumptions (LawfulDataset.assumed_contracts, the name: lines of foundation/assumptions.txt)",
  "hset, hden: the dataset is a set and has the store's denotation",
]
status = "proposed"
statement_sha256 = "952d5363d7d07026ebd2a18795b2c684a7f5d6c370033df18f3a6eed09e442db"
spec_defs = [
  { name = "L4Factoidal.Dataflow.referenceAnswer", file = "formal/lean4/L4Factoidal/Dataflow/Evaluator.lean", sha256 = "b85e89fd69dc77c5643db2769d2859c6e5f3325e28e48732f51c7464b8bcadbb" },
  { name = "L4Factoidal.Dataflow.EvalContract", file = "formal/lean4/L4Factoidal/Dataflow/Evaluator.lean", sha256 = "e5cf63db4744f6e7c588829fdaa681a93b3bbd31d8390211bfd0b0bf092832f4" },
  { name = "L4Factoidal.Dataflow.AnswerAgrees", file = "formal/lean4/L4Factoidal/Dataflow/Evaluator.lean", sha256 = "7a70e8e9c336e99fb6b9671f23f0e8dd55afb1bd6ad8a03a36e4a16ccd2f51b1" },
]

[[claim]]
id = "shipped-parse-query-pipeline"
theorem = "L4Factoidal.Dataflow.shipped_pipeline_sound"
file = "formal/lean4/L4Factoidal/Dataflow/EndToEnd.lean"
about = "pipeline with shippedEvaluator, the evaluator of the wasm query ops"
says = """When a reader accepts a document, the shipped pipeline parses it to the set of quads of the raw parse, loads a store whose law is proved, and answers the query with an answer that satisfies EvalContract (see sparql-eval-lawful-dataset)."""
does_not_say = """The shipped evaluator's backend path outside the native fragment and its SELECT fast paths are ASSUMED correct (h1, h2), not proved. It does not say that the wasm or native binary computes shippedRun: the Lean compiler, the C externs and emscripten are outside the proof (P5, https://github.com/danbri/factoidal-core/issues/1182)."""
assumptions = [
  "h1: BackendOutsideFragmentAgrees (the backend path outside NativeFrag satisfies EvalContract)",
  "h2: SelectFastPathAgrees (the SELECT fast paths satisfy EvalContract)",
  "h: the reader accepts the document (a case split, not an assumption)",
]
status = "proposed"
statement_sha256 = "b911f5027b8152cf0c430797fbef280eee0e1aea5f7a5582910c87875ab76b02"
spec_defs = [
  { name = "L4Factoidal.Dataflow.BackendOutsideFragmentAgrees", file = "formal/lean4/L4Factoidal/Dataflow/Evaluator.lean", sha256 = "e09931f3046776ad15efb15b7c6102806c5eaae5801a37817463ae050cf47aef" },
  { name = "L4Factoidal.Dataflow.SelectFastPathAgrees", file = "formal/lean4/L4Factoidal/Dataflow/Evaluator.lean", sha256 = "98972272ae45f539707bb7213e486781bb31497bab3a872f7c1ad043208c3b87" },
]

[[claim]]
id = "rdfs-regime-bgp-sound"
theorem = "L4Factoidal.SPARQL.rdfsRegime_bgp_sound"
file = "formal/lean4/L4Factoidal/SPARQL/EntailmentRegimeRdfs.lean"
about = "evalBgp over RDFS.closure (the SPARQL RDFS entailment regime, BGP level)"
says = """Every solution of a basic graph pattern over the rho-df closure of g instantiates the pattern to triples that RDFS derivation licenses from g itself."""
does_not_say = """Soundness only: it does not say the regime finds every entailed solution (completeness). It is about one BGP, not a whole query. RDFS.Derives is the Lean reading of the RDFS rules; its fidelity to RDF 1.1 Semantics is a separate question."""
assumptions = []
status = "proposed"
statement_sha256 = "84b23543dd28424c49b9f56428e745a143c91d24a11d0be4492e95ef466911d3"
spec_defs = [
  { name = "L4Factoidal.SPARQL.RdfsLicenses", file = "formal/lean4/L4Factoidal/SPARQL/EntailmentRegimeRdfs.lean", sha256 = "627dbfefa7d520c355cdb02494aadb59c81fcb773b48f41931ac337c7a3e9c92" },
  { name = "L4Factoidal.RDFS.Derives", file = "formal/lean4/L4Factoidal/RDFS/RdfsCore.lean", sha256 = "e3121168295fd7c87c13b3f99f6f91200b41953b6a499e67c72e663064d61d18" },
]

[[claim]]
id = "owl-rl-closure-exact"
theorem = "L4Factoidal.OWL.RL.mem_indexedClosureSN_iff"
file = "formal/lean4/L4Factoidal/OWL/RLSemiNaiveTheorems.lean"
about = "indexedClosureSN, the semi-naive OWL 2 RL closure"
says = """When the closure is saturated and the list fuel is adequate, a triple is in the semi-naive OWL 2 RL closure exactly when the OWL 2 RL rules derive it from g."""
does_not_say = """It does not prove that the fuel the engine gives is enough (termination at closureFuelBound is not proved). Derives is the Lean reading of the OWL 2 Profiles section 4.3 rule tables."""
assumptions = [
  "hsat: the result is saturated (one more round adds nothing)",
  "hlf: the list fuel is adequate for the rdf:List structures of the result",
]
status = "proposed"
statement_sha256 = "8277cc6ba1bbc0894715095f856370c92e27b0c9b2c69f56126b591bf5c7512f"
spec_defs = [
  { name = "L4Factoidal.OWL.RL.Derives", file = "formal/lean4/L4Factoidal/OWL/RLRules.lean", sha256 = "558701a61189b9ab04ef9ea12c1c640b2723fc1c02bb0a22d8c96ee28fd3af92" },
]

[[claim]]
id = "rdf-closure-entailed"
theorem = "L4Factoidal.RDF.rdfClosure_entails"
file = "formal/lean4/L4Factoidal/RDF/EntailmentRegimeSoundness.lean"
about = "RDFS.rdfClosure (RDF entailment closure)"
says = """Under the RDF semantic conditions, a graph entails its RDF closure, for container membership IRIs that are rdf:_n."""
does_not_say = """Soundness of the closure only, not completeness. RdfEntails is the Lean reading of RDF 1.1 Semantics section 7."""
assumptions = ["hcmps: every listed container membership IRI is an rdf:_n IRI"]
