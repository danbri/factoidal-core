stages = ["ntriplesDocumentWriter", "nquadsDocumentWriter", "canonicalNQuadsDocumentWriter", "turtleDocumentWriter", "trigDocumentWriter", "rdfxmlDocumentWriter"]
covers = "part"
note = "Wasm/Ops/Handles.lean: as datasetSerialize; the Turtle options reach the RdfWriter run as TurtleRenderOptions. Not covered: the options JSON parse (turtleOptionsOfJson) and the envelope."

[[entry]]
id = "npm:.#serialize"
stages = ["ntriplesDocumentWriter", "nquadsDocumentWriter", "canonicalNQuadsDocumentWriter", "turtleDocumentWriter", "trigDocumentWriter", "rdfxmlDocumentWriter"]
covers = "part"
note = "npm/factoidal/lib/dataset.mjs _write: every format except jsonld calls datasetSerialize or datasetSerializeWith (RdfWriter table). Not covered: format jsonld (datasetToJsonLd, jsonldFromRdf with options, not the JSON-LD RdfWriter), rdfc (canonicalizeOf), the option checks, and the JS cache of the N-Quads text."

[[entry]]
id = "npm:./browser#serialize"
stages = ["ntriplesDocumentWriter", "nquadsDocumentWriter", "canonicalNQuadsDocumentWriter", "turtleDocumentWriter", "trigDocumentWriter", "rdfxmlDocumentWriter"]
covers = "part"
note = "npm/factoidal/lib/dataset.mjs _write: every format except jsonld calls datasetSerialize or datasetSerializeWith (RdfWriter table). Not covered: format jsonld (datasetToJsonLd, jsonldFromRdf with options, not the JSON-LD RdfWriter), rdfc (canonicalizeOf), the option checks, and the JS cache of the N-Quads text."
