[[entry]]
id = "wasm:datasetSerialize"
stages = ["ntriplesDocumentWriter", "nquadsDocumentWriter", "canonicalNQuadsDocumentWriter", "turtleDocumentWriter", "trigDocumentWriter", "rdfxmlDocumentWriter"]
covers = "part"
note = "Wasm/Ops/Handles.lean: the N-Quads, N-Triples, Turtle, TriG and RDF/XML tags write through the RdfWriter table (handleWriter, handleCanonicalNQuadsWriter, Dataflow/Writer.lean). Not covered: the rdfc tag (canonicalizeOf, rdfcStage), the RDF 1.1 refusal check (checked), the N-Triples refusal of a named graph, and the JSON envelope."

[[entry]]
