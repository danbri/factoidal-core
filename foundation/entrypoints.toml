covers = "part"
note = "Wasm/Ops/StoreServe.lean storeServeOpen: storeOpen (backendOfRetained: LawfulDataset.ofDataset) for the base, then View.of (LawfulDataset.ofDataset when every graph name is an IRI) after the delta-log replay. Not covered: the manifest decode, the block reads and decode, the delta-log decode and replay (openLog, applyDeltaEntries), the serve configuration."

