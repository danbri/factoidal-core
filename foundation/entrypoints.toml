# Entry point -> dataflow stage mapping, version 0 (2026-10-24).
#
# https://github.com/danbri/factoidal/issues/975, "Architecture acceptance",
# item 3. tools/entrypoint-gate.py enumerates every npm export, wasm op and
# CLI command from the tree; each must be an [[entry]] here (mapped to stages
# of docs/dataflow-inventory.md), a [[nonstage]] here (runs no stage, with a
# reason), a literal constant or Error class (found by the gate), or a line in
# foundation/unbound-entrypoints.txt.
#
# An entry maps to a stage only when that stage's run function is what the
# entry computes, checked by reading the op body (file named in the note).
# covers = "whole": the entry is the stage. covers = "part": the entry runs
# the stage plus steps no stage covers (input parsing, output rendering,
# another regime); the note names them. A stage is named by its `stage`
# cell, or by its `area` cell when the registry entry has no declaration.
# Mappings are Claude-inferred (2026-10-24), not owner decisions.

[manifest]
version = 0

[[entry]]
id = "wasm:parseToDatasetJson"
stages = ["ntriplesDocumentReader", "nquadsDocumentReader", "turtleDocumentReader", "trigDocumentReader", "rdfxmlDocumentReader", "jsonldDocumentReader"]
covers = "part"
note = "Wasm/Ops/Parse.lean: the pure entry parseTextToDatasetBy and the IO entry parseDocumentOutcomeBy read the document only through readerOf (the RdfReader table Dataflow.readers). Not covered: the blank-node scope of the IO entry (nextDocumentScope, a fresh-label supply), the declaration-order prefixes, and the output text Dataset.toCanonicalNQuads (no writer stage)."

[[entry]]
id = "wasm:canonicalizeToNQuads"
stages = ["rdfcStage"]
covers = "part"
note = "Wasm/Ops/Canon.lean canonicalizeParsed calls RDF.Canonical.canonicalize (rdfcStage's run). The input is read by parseNQuadsFast, a dataset with an RDF 1.2 term is refused, and the envelope has no SHA-256 hex."

[[entry]]
id = "wasm:datasetCanonicalize"
stages = ["rdfcStage"]
covers = "part"
note = "canonicalizeOf on the stored dataset, then the canonicalizeToNQuads path."

[[entry]]
id = "wasm:owlClosure"
stages = ["rdfsReasoner", "owlRlReasoner"]
covers = "part"
note = "Wasm/Ops/Reason.lean owlClosureParsed: mode RDFS runs RDFS.fullClosure (rdfsReasoner), mode OWL-RL runs OWL.RL.closureFix (owlRlReasoner). Default graph only."

[[entry]]
id = "wasm:rhoDfClosure"
stages = ["rhoDfReasoner"]
covers = "part"
note = "RDFS.closureFix of the default graph; rhoDfReasoner runs RDFS.closureFix. The round count is extra output."

[[entry]]
id = "wasm:datasetClosure"
stages = ["rdfsReasoner", "owlRlReasoner", "rhoDfReasoner"]
covers = "part"
note = "closureStreamOf for regimes rdfs, owl-rl, rho-df; the rdfs-plus regime has no stage."

[[entry]]
id = "wasm:shaclValidate"
stages = ["shaclValidator"]
covers = "part"
note = "Wasm/Ops/Validate.lean shaclValidateParsed: decodeShapesGraph and validateFull with the default config (shaclValidator's run); N-Quads input parse and report serialisation are outside the stage."

[[entry]]
id = "wasm:datasetShaclValidate"
stages = ["shaclValidator"]
covers = "part"
note = "shaclValidateParsed on two stored datasets."

[[entry]]
id = "wasm:proofCheck"
stages = ["proofCheckStage"]
covers = "part"
note = "Wasm/Ops/Proof.lean: checkBundle (the function proofCheckStage runs). The op reports the verdict and the assumption frontier; the stage accepts foundational-only bundles."

[[entry]]
id = "wasm:explainGraph"
stages = ["rdfsExplainGraphStage"]
covers = "part"
note = "Wasm/Ops/Explain.lean explainGraphParsed runs rdfsExplainGraphStage (withMinimalD []) with the default graph and every named graph of the sources selected. Not covered: the N-Quads read of both texts (readNQuadsText, the reader table), the document scopes 0 and 1 (Dataset.scopeDocument), the refusal of a description with a named graph, and the JSON encoding of the result (https://github.com/danbri/factoidal/issues/1002)."

[[entry]]
id = "wasm:updateDataset"
stages = ["updateStage"]
covers = "part"
note = "Wasm/Ops/Query.lean applyUpdateText: parseSparqlUpdate, then applyUpdateIn (updateStage's run). The update grammar has no stage."

[[entry]]
id = "wasm:datasetUpdate"
stages = ["updateStage"]
covers = "part"
note = "applyUpdateText on the stored dataset."

[[entry]]
id = "wasm:queryDataset"
stages = ["nquadsDocumentReader", "LawfulDataset.ofCertified", "lawfulWhereStage", "shippedEvaluator"]
covers = "part"
note = "Wasm/Ops/Query.lean queryDataset: readNQuadsCertified (the N-Quads RdfReader with its set proof), then queryParsedCertified: the backend evaluator runs only over the LawfulDataset of LawfulDataset.ofCertified (LawfulDataset.runSelect / runAsk), else evalSelect / evalAsk. Not covered: the SELECT layer of the backend runner, the arms outside NativeFrag, CONSTRUCT / DESCRIBE serialisation, the results envelope. The evaluation is ev.run of a LawfulEvaluator (default shippedEvaluator, Dataflow/Evaluator.lean) over the backend of the LawfulDataset."

[[entry]]
id = "wasm:datasetQuery"
stages = ["LawfulDataset.ofCertified", "lawfulWhereStage", "shippedEvaluator"]
covers = "part"
note = "Wasm/Ops/Handles.lean datasetQuery: queryParsedDatasetWith over the handle's CertifiedDataset and its cached LawfulDataset (ofCertified). Not covered: as wasm:queryDataset. The evaluation is ev.run of a LawfulEvaluator (default shippedEvaluator, Dataflow/Evaluator.lean) over the backend of the LawfulDataset."

[[entry]]
id = "wasm:queryDataset12"
stages = ["nquadsDocumentReader", "LawfulDataset.ofCertified", "lawfulWhereStage", "shippedEvaluator"]
covers = "part"
note = "Wasm/Ops/Query.lean queryDataset12IO: readNQuadsCertified, then queryParsedCertified with the SPARQL 1.2 grammar. Not covered: as wasm:queryDataset; the SPARQL 1.2 grammar has no stage. The evaluation is ev.run of a LawfulEvaluator (default shippedEvaluator, Dataflow/Evaluator.lean) over the backend of the LawfulDataset."

[[entry]]
id = "wasm:datasetQuery12"
stages = ["LawfulDataset.ofCertified", "lawfulWhereStage", "shippedEvaluator"]
covers = "part"
note = "Wasm/Ops/Handles.lean datasetQuery12: datasetQuery with the SPARQL 1.2 grammar. Not covered: as wasm:queryDataset12. The evaluation is ev.run of a LawfulEvaluator (default shippedEvaluator, Dataflow/Evaluator.lean) over the backend of the LawfulDataset."

[[entry]]
id = "wasm:datasetMatch"
stages = ["LawfulDataset.ofCertified", "LawfulStore.ofIndexed"]
covers = "part"
note = "Wasm/Ops/Handles.lean matchDataset: the default graph is searched through LawfulStore.search of the handle's LawfulDataset (the index arm of indexedDatasetBackend), the named graphs through the backends of the same record. Not covered: the quad-pattern JSON reader (quadPatternOf) and the new handle."

[[entry]]
id = "wasm:datasetMatchCount"
stages = ["LawfulDataset.ofCertified", "LawfulStore.ofIndexed"]
covers = "part"
note = "matchDataset as wasm:datasetMatch, then the quad count. Not covered: quadPatternOf."

[[entry]]
id = "wasm:storeQuery"
stages = ["LawfulDataset.ofDataset", "lawfulWhereStage", "shippedEvaluator"]
covers = "part"
note = "Wasm/Ops/Store.lean storeQuery: the blocks the plan selects are decoded to a dataset, and queryParsedDatasetWith runs the backend evaluator over LawfulDataset.ofDataset (named assumption datasetIsSet) when every graph name is an IRI, else the reference evaluator. Not covered: the manifest plan, the block reads and decode (IBK3, IBK4, IBK5). The evaluation is ev.run of a LawfulEvaluator (default shippedEvaluator, Dataflow/Evaluator.lean) over the backend of the LawfulDataset."

[[entry]]
id = "wasm:storeHandleQuery"
stages = ["LawfulDataset.ofDataset", "lawfulWhereStage", "shippedEvaluator"]
covers = "part"
note = "Wasm/Ops/StoreHandles.lean storeHandleQuery: queryParsedDatasetWith over the handle's dataset and backendOfRetained (LawfulDataset.ofDataset). Not covered: the literal and geo index plans, the retained-artifact selection. The evaluation is ev.run of a LawfulEvaluator (default shippedEvaluator, Dataflow/Evaluator.lean) over the backend of the LawfulDataset."

[[entry]]
