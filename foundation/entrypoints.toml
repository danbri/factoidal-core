[[entry]]
id = "wasm:storeServeRequest"
stages = ["LawfulDataset.ofDataset", "lawfulWhereStage", "shippedEvaluator", "updateStage"]
covers = "part"
note = "Wasm/Ops/StoreServe.lean storeServeRequest: HTTP.Wire.frameRequest, then StoreEndpoint.handle; a query goes protocolOutcome -> evalPayload, which is ev.run of a LawfulEvaluator (default shippedEvaluator; L4Factoidal/SPARQL/StoreEndpoint.lean, evalPayload_backendOrReference) over View.evalInput (the view's LawfulDataset.ofDataset record, View.of / backendOfRetained); an update goes applyUpdateIn (updateStage's run). Not covered: the HTTP framing and response bytes, the protocol decoder and negotiation, the results formats, the Graph Store Protocol (GraphStoreService.serve, parseQuadsAs), the service description, the delta-log batch (appendBytes)."

