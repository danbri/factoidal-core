covers = "part"
note = "Wasm/Ops/Handles.lean datasetOpenBy: parseDocumentOutcomeBy, which reads through readerOf (the RdfReader table). Not covered: the document scope (nextDocumentScope), the handle table and its index."

[[entry]]
id = "wasm:parseQuadsJson"
stages = ["ntriplesDocumentReader", "nquadsDocumentReader", "turtleDocumentReader", "trigDocumentReader", "rdfxmlDocumentReader", "jsonldDocumentReader"]
covers = "part"
note = "Wasm/Ops/Handles.lean parseQuadsJsonBy: parseDocumentOutcomeBy (RdfReader table); the TermJson output has no writer stage."

[[entry]]
id = "wasm:parseDocument"
stages = ["ntriplesDocumentReader", "nquadsDocumentReader", "turtleDocumentReader", "trigDocumentReader", "rdfxmlDocumentReader", "jsonldDocumentReader"]
covers = "part"
note = "Wasm/Ops/Lenient.lean parseDocumentWithBy: without lenient, parseToDatasetJsonWithBy (RdfReader table). Not covered: the lenient readers of Turtle, TriG, N-Triples and N-Quads (Syntax/*Lenient.lean), which are not RdfReaders (a lenient result with diagnostics is outside ReaderContract)."

[[entry]]
id = "npm:.#parse"
stages = ["ntriplesDocumentReader", "nquadsDocumentReader", "turtleDocumentReader", "trigDocumentReader", "rdfxmlDocumentReader", "jsonldDocumentReader"]
covers = "part"
note = "npm/factoidal/lib/api.mjs parse (browser.js and index.mjs): strict = openText, the wasm op datasetOpen (RdfReader table). Not covered: {lenient:true} (wasm op parseDocument, lenient readers), the format inference of formatTagOf, the JS Dataset wrapper."

[[entry]]
