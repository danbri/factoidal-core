# Entry point -> dataflow stage mapping, version 0 (2026-10-24).
#
# https://github.com/danbri/factoidal/issues/975, "Architecture acceptance",
# item 3. tools/entrypoint-gate.py enumerates every npm export, wasm op and
# CLI command from the tree; each must be an [[entry]] here (mapped to stages
# of docs/dataflow-inventory.md), a [[nonstage]] here (runs no stage, with a
# reason), a literal constant or Error class (found by the gate), or a line in
# foundation/unbound-entrypoints.txt.
#
# An entry maps to a stage only when that stage's run function is what the
# entry computes, checked by reading the op body (file named in the note).
# covers = "whole": the entry is the stage. covers = "part": the entry runs
# the stage plus steps no stage covers (input parsing, output rendering,
# another regime); the note names them. A stage is named by its `stage`
# cell, or by its `area` cell when the registry entry has no declaration.
# Mappings are Claude-inferred (2026-10-24), not owner decisions.

[manifest]
version = 0

[[entry]]
id = "wasm:parseToDatasetJson"
stages = ["scopedParseStage"]
covers = "part"
note = "Wasm/Ops/Parse.lean parseTextToDatasetBy calls RDF.Source.parseDocument (parseStage's run); the IO entry scopes the blank nodes (nextDocumentScope). The output text is Dataset.toCanonicalNQuads, which has no writer stage."

[[entry]]
id = "wasm:canonicalizeToNQuads"
stages = ["rdfcStage"]
covers = "part"
note = "Wasm/Ops/Canon.lean canonicalizeParsed calls RDF.Canonical.canonicalize (rdfcStage's run). The input is read by parseNQuadsFast, a dataset with an RDF 1.2 term is refused, and the envelope has no SHA-256 hex."

[[entry]]
id = "wasm:datasetCanonicalize"
stages = ["rdfcStage"]
covers = "part"
note = "canonicalizeOf on the stored dataset, then the canonicalizeToNQuads path."

[[entry]]
id = "wasm:owlClosure"
stages = ["rdfsClosureStage", "owlRlClosureStage"]
covers = "part"
note = "Wasm/Ops/Reason.lean owlClosureParsed: mode RDFS runs RDFS.fullClosure (rdfsClosureStage), mode OWL-RL runs OWL.RL.closureFix (owlRlClosureStage). Default graph only."

[[entry]]
id = "wasm:rhoDfClosure"
stages = ["rhoDfClosureStage"]
covers = "part"
note = "RDFS.closureFix of the default graph; rhoDfClosureStage runs RDFS.closure with a caller fuel. The round count is extra output."

[[entry]]
id = "wasm:datasetClosure"
stages = ["rdfsClosureStage", "owlRlClosureStage", "rhoDfClosureStage"]
covers = "part"
note = "closureStreamOf for regimes rdfs, owl-rl, rho-df; the rdfs-plus regime has no stage."

[[entry]]
id = "wasm:shaclValidate"
stages = ["shaclStage"]
covers = "part"
note = "Wasm/Ops/Validate.lean shaclValidateParsed: decodeShapesGraph and validateFull with the default config (shaclStage's run); N-Quads input parse and report serialisation are outside the stage."

[[entry]]
id = "wasm:datasetShaclValidate"
stages = ["shaclStage"]
covers = "part"
note = "shaclValidateParsed on two stored datasets."

[[entry]]
id = "wasm:proofCheck"
stages = ["proofCheckStage"]
covers = "part"
note = "Wasm/Ops/Proof.lean: checkBundle (the function proofCheckStage runs). The op reports the verdict and the assumption frontier; the stage accepts foundational-only bundles."

[[entry]]
id = "wasm:updateDataset"
stages = ["updateStage"]
covers = "part"
note = "Wasm/Ops/Query.lean applyUpdateText: parseSparqlUpdate, then applyUpdateIn (updateStage's run). The update grammar has no stage."

[[entry]]
id = "wasm:datasetUpdate"
stages = ["updateStage"]
covers = "part"
note = "applyUpdateText on the stored dataset."

[[entry]]
id = "wasm:queryDataset"
stages = ["SPARQL query evaluation (reference evaluator)"]
covers = "part"
note = "parseSparql, then evalSelect / evalAsk; eligible queries run on indexedDatasetBackend (Storage.BackendRefinement proves evalPatternBackend's WHERE answer; this mapping does not claim that link)."

[[entry]]
id = "wasm:datasetQuery"
stages = ["SPARQL query evaluation (reference evaluator)"]
covers = "part"
note = "queryDataset over a stored dataset."

[[entry]]
id = "wasm:vcEddsaCreateFromCanonical"
stages = ["vcSignStage"]
covers = "part"
note = "VC.DataIntegrity.createFromCanonical with Ed25519.sign: the first conjunct of SignContract. The caller gives the canonical forms; vcSignStage canonicalizes the datasets itself."

[[entry]]
id = "wasm:vcEddsaVerifyFromCanonical"
stages = ["vcVerifyStage"]
covers = "part"
note = "VC.DataIntegrity.verifyFromCanonical with Ed25519.verify: the first conjunct of VerifyContract, on caller-given canonical forms."

[[entry]]
id = "npm:.#update"
stages = ["updateStage"]
covers = "part"
note = "lib/dataset.mjs Dataset.update calls the wasm op datasetUpdate."

[[entry]]
id = "npm:.#canonicalize"
stages = ["rdfcStage"]
covers = "part"
note = "Dataset.toString('rdfc') calls datasetSerialize with tag rdfc, which runs canonicalizeOf."

[[entry]]
id = "npm:.#canonicalizeNQuads"
stages = ["rdfcStage"]
covers = "part"
note = "lib/pure.mjs calls the wasm op canonicalizeToNQuads."

[[entry]]
id = "npm:.#shaclValidate"
stages = ["shaclStage"]
covers = "part"
note = "lib/api.mjs calls the wasm op datasetShaclValidate."

[[entry]]
id = "npm:.#closure"
stages = ["rdfsClosureStage", "owlRlClosureStage", "rhoDfClosureStage"]
covers = "part"
note = "lib/api.mjs calls the wasm op datasetClosure; regimes none, x-rdfsplus have no stage."

[[entry]]
id = "npm:.#owlClosure"
stages = ["rdfsClosureStage", "owlRlClosureStage"]
covers = "part"
note = "lib/api.mjs owlClosure calls closure (datasetClosure) with mode RDFS or OWL-RL."

[[entry]]
id = "npm:.#coreRdfsClosure"
stages = ["rhoDfClosureStage"]
covers = "part"
note = "closure(data, 'rho-df'): datasetClosure regime rho-df."

[[entry]]
id = "npm:.#rhoDfClosure"
stages = ["rhoDfClosureStage"]
covers = "part"
note = "alias of coreRdfsClosure."

[[entry]]
id = "npm:.#proofCheck"
stages = ["proofCheckStage"]
covers = "part"
note = "lib/pure.mjs calls the wasm op proofCheck."

[[entry]]
id = "npm:.#query"
stages = ["SPARQL query evaluation (reference evaluator)"]
covers = "part"
note = "lib/api.mjs calls the wasm op datasetQuery (or datasetQuery12 for SPARQL 1.2)."

[[entry]]
id = "npm:.#vcEddsaCreateFromCanonical"
stages = ["vcSignStage"]
covers = "part"
note = "lib/api.mjs calls the wasm op vcEddsaCreateFromCanonical."

[[entry]]
id = "npm:.#vcEddsaVerifyFromCanonical"
stages = ["vcVerifyStage"]
covers = "part"
note = "lib/api.mjs calls the wasm op vcEddsaVerifyFromCanonical."

[[entry]]
id = "npm:./browser#update"
stages = ["updateStage"]
covers = "part"
note = "lib/dataset.mjs Dataset.update calls the wasm op datasetUpdate."

[[entry]]
id = "npm:./browser#canonicalize"
stages = ["rdfcStage"]
covers = "part"
note = "Dataset.toString('rdfc') calls datasetSerialize with tag rdfc, which runs canonicalizeOf."

[[entry]]
id = "npm:./browser#canonicalizeNQuads"
stages = ["rdfcStage"]
covers = "part"
note = "lib/pure.mjs calls the wasm op canonicalizeToNQuads."

[[entry]]
id = "npm:./browser#shaclValidate"
stages = ["shaclStage"]
covers = "part"
note = "lib/api.mjs calls the wasm op datasetShaclValidate."

[[entry]]
id = "npm:./browser#closure"
stages = ["rdfsClosureStage", "owlRlClosureStage", "rhoDfClosureStage"]
covers = "part"
note = "lib/api.mjs calls the wasm op datasetClosure; regimes none, x-rdfsplus have no stage."

[[entry]]
id = "npm:./browser#owlClosure"
stages = ["rdfsClosureStage", "owlRlClosureStage"]
covers = "part"
note = "lib/api.mjs owlClosure calls closure (datasetClosure) with mode RDFS or OWL-RL."

[[entry]]
id = "npm:./browser#coreRdfsClosure"
stages = ["rhoDfClosureStage"]
covers = "part"
note = "closure(data, 'rho-df'): datasetClosure regime rho-df."

[[entry]]
id = "npm:./browser#rhoDfClosure"
stages = ["rhoDfClosureStage"]
covers = "part"
note = "alias of coreRdfsClosure."

[[entry]]
id = "npm:./browser#proofCheck"
stages = ["proofCheckStage"]
covers = "part"
note = "lib/pure.mjs calls the wasm op proofCheck."

[[entry]]
id = "npm:./browser#query"
stages = ["SPARQL query evaluation (reference evaluator)"]
covers = "part"
note = "lib/api.mjs calls the wasm op datasetQuery (or datasetQuery12 for SPARQL 1.2)."

[[entry]]
id = "npm:./browser#vcEddsaCreateFromCanonical"
stages = ["vcSignStage"]
covers = "part"
note = "lib/api.mjs calls the wasm op vcEddsaCreateFromCanonical."

[[entry]]
id = "npm:./browser#vcEddsaVerifyFromCanonical"
stages = ["vcVerifyStage"]
covers = "part"
note = "lib/api.mjs calls the wasm op vcEddsaVerifyFromCanonical."

[[nonstage]]
id = "wasm:ops"
reason = "reflection: lists the op table, reads no data"

[[nonstage]]
id = "wasm:engineTables"
reason = "reflection: the engine's syntax and regime tables, reads no data"

[[nonstage]]
id = "wasm:datasetFormats"
reason = "reflection: the format table, reads no data"

[[nonstage]]
id = "wasm:blobEcho"
reason = "ABI test op: returns its byte region unchanged"

[[nonstage]]
id = "cli:version"
reason = "prints the package and engine version"

[[nonstage]]
id = "npm:./package.json"
reason = "package metadata file"

[[nonstage]]
id = "npm:./l4-assets/*"
reason = "the engine files (wasm and loader); their ops are the wasm: entries"

[[nonstage]]
id = "npm:.#version"
reason = "the package version string"

[[nonstage]]
id = "npm:./browser#version"
reason = "the package version string"

[[nonstage]]
id = "npm:.#capabilities"
reason = "reflection: which ops the loaded engine has"

[[nonstage]]
id = "npm:./browser#capabilities"
reason = "reflection: which ops the loaded engine has"

[[nonstage]]
id = "npm:.#engineTables"
reason = "reflection: the engine's syntax and regime tables"

[[nonstage]]
id = "npm:./browser#engineTables"
reason = "reflection: the engine's syntax and regime tables"

[[nonstage]]
