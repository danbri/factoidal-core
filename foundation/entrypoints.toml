# Entry point -> dataflow stage mapping, version 0 (2026-10-24).
#
# https://github.com/danbri/factoidal/issues/975, "Architecture acceptance",
# item 3. tools/entrypoint-gate.py enumerates every npm export, wasm op and
# CLI command from the tree; each must be an [[entry]] here (mapped to stages
# of docs/dataflow-inventory.md), a [[nonstage]] here (runs no stage, with a
# reason), a literal constant or Error class (found by the gate), or a line in
# foundation/unbound-entrypoints.txt.
#
# An entry maps to a stage only when that stage's run function is what the
# entry computes, checked by reading the op body (file named in the note).
# covers = "whole": the entry is the stage. covers = "part": the entry runs
# the stage plus steps no stage covers (input parsing, output rendering,
# another regime); the note names them. A stage is named by its `stage`
# cell, or by its `area` cell when the registry entry has no declaration.
# Mappings are Claude-inferred (2026-10-24), not owner decisions.

[manifest]
version = 0

[[entry]]
id = "wasm:parseToDatasetJson"
stages = ["ntriplesDocumentReader", "nquadsDocumentReader", "turtleDocumentReader", "trigDocumentReader", "rdfxmlDocumentReader", "jsonldDocumentReader"]
covers = "part"
note = "Wasm/Ops/Parse.lean: the pure entry parseTextToDatasetBy and the IO entry parseDocumentOutcomeBy read the document only through readerOf (the RdfReader table Dataflow.readers). Not covered: the blank-node scope of the IO entry (nextDocumentScope, a fresh-label supply), the declaration-order prefixes, and the output text Dataset.toCanonicalNQuads (no writer stage)."

[[entry]]
id = "wasm:canonicalizeToNQuads"
stages = ["rdfcStage"]
covers = "part"
note = "Wasm/Ops/Canon.lean canonicalizeParsed calls RDF.Canonical.canonicalize (rdfcStage's run). The input is read by parseNQuadsFast, a dataset with an RDF 1.2 term is refused, and the envelope has no SHA-256 hex."

[[entry]]
id = "wasm:datasetCanonicalize"
stages = ["rdfcStage"]
covers = "part"
note = "canonicalizeOf on the stored dataset, then the canonicalizeToNQuads path."

[[entry]]
id = "wasm:owlClosure"
stages = ["rdfsClosureStage", "owlRlClosureStage"]
covers = "part"
note = "Wasm/Ops/Reason.lean owlClosureParsed: mode RDFS runs RDFS.fullClosure (rdfsClosureStage), mode OWL-RL runs OWL.RL.closureFix (owlRlClosureStage). Default graph only."

[[entry]]
id = "wasm:rhoDfClosure"
stages = ["rhoDfClosureStage"]
covers = "part"
note = "RDFS.closureFix of the default graph; rhoDfClosureStage runs RDFS.closure with a caller fuel. The round count is extra output."

[[entry]]
id = "wasm:datasetClosure"
stages = ["rdfsClosureStage", "owlRlClosureStage", "rhoDfClosureStage"]
covers = "part"
note = "closureStreamOf for regimes rdfs, owl-rl, rho-df; the rdfs-plus regime has no stage."

[[entry]]
id = "wasm:shaclValidate"
stages = ["shaclStage"]
covers = "part"
note = "Wasm/Ops/Validate.lean shaclValidateParsed: decodeShapesGraph and validateFull with the default config (shaclStage's run); N-Quads input parse and report serialisation are outside the stage."

[[entry]]
id = "wasm:datasetShaclValidate"
stages = ["shaclStage"]
covers = "part"
note = "shaclValidateParsed on two stored datasets."

[[entry]]
id = "wasm:proofCheck"
stages = ["proofCheckStage"]
covers = "part"
note = "Wasm/Ops/Proof.lean: checkBundle (the function proofCheckStage runs). The op reports the verdict and the assumption frontier; the stage accepts foundational-only bundles."

[[entry]]
id = "wasm:updateDataset"
stages = ["updateStage"]
covers = "part"
note = "Wasm/Ops/Query.lean applyUpdateText: parseSparqlUpdate, then applyUpdateIn (updateStage's run). The update grammar has no stage."

[[entry]]
id = "wasm:datasetUpdate"
stages = ["updateStage"]
covers = "part"
note = "applyUpdateText on the stored dataset."

[[entry]]
id = "wasm:queryDataset"
stages = ["nquadsDocumentReader", "LawfulDataset.ofCertified", "lawfulWhereStage", "SPARQL query evaluation (reference evaluator)"]
covers = "part"
note = "Wasm/Ops/Query.lean queryDataset: readNQuadsCertified (the N-Quads RdfReader with its set proof), then queryParsedCertified: the backend evaluator runs only over the LawfulDataset of LawfulDataset.ofCertified (LawfulDataset.runSelect / runAsk), else evalSelect / evalAsk. Not covered: the SELECT layer of the backend runner, the arms outside NativeFrag, CONSTRUCT / DESCRIBE serialisation, the results envelope."

[[entry]]
id = "wasm:datasetQuery"
stages = ["LawfulDataset.ofCertified", "lawfulWhereStage", "SPARQL query evaluation (reference evaluator)"]
covers = "part"
note = "Wasm/Ops/Handles.lean datasetQuery: queryParsedDatasetWith over the handle's CertifiedDataset and its cached LawfulDataset (ofCertified). Not covered: as wasm:queryDataset."

[[entry]]
id = "wasm:queryDataset12"
stages = ["nquadsDocumentReader", "LawfulDataset.ofCertified", "lawfulWhereStage", "SPARQL query evaluation (reference evaluator)"]
covers = "part"
note = "Wasm/Ops/Query.lean queryDataset12IO: readNQuadsCertified, then queryParsedCertified with the SPARQL 1.2 grammar. Not covered: as wasm:queryDataset; the SPARQL 1.2 grammar has no stage."

[[entry]]
id = "wasm:datasetQuery12"
stages = ["LawfulDataset.ofCertified", "lawfulWhereStage", "SPARQL query evaluation (reference evaluator)"]
covers = "part"
note = "Wasm/Ops/Handles.lean datasetQuery12: datasetQuery with the SPARQL 1.2 grammar. Not covered: as wasm:queryDataset12."

[[entry]]
id = "wasm:datasetMatch"
stages = ["LawfulDataset.ofCertified", "LawfulStore.ofIndexed"]
covers = "part"
note = "Wasm/Ops/Handles.lean matchDataset: the default graph is searched through LawfulStore.search of the handle's LawfulDataset (the index arm of indexedDatasetBackend), the named graphs through the backends of the same record. Not covered: the quad-pattern JSON reader (quadPatternOf) and the new handle."

[[entry]]
id = "wasm:datasetMatchCount"
stages = ["LawfulDataset.ofCertified", "LawfulStore.ofIndexed"]
covers = "part"
note = "matchDataset as wasm:datasetMatch, then the quad count. Not covered: quadPatternOf."

[[entry]]
id = "wasm:storeQuery"
stages = ["LawfulDataset.ofDataset", "lawfulWhereStage", "SPARQL query evaluation (reference evaluator)"]
covers = "part"
note = "Wasm/Ops/Store.lean storeQuery: the blocks the plan selects are decoded to a dataset, and queryParsedDatasetWith runs the backend evaluator over LawfulDataset.ofDataset (named assumption datasetIsSet) when every graph name is an IRI, else the reference evaluator. Not covered: the manifest plan, the block reads and decode (IBK3, IBK4, IBK5)."

[[entry]]
id = "wasm:storeHandleQuery"
stages = ["LawfulDataset.ofDataset", "lawfulWhereStage", "SPARQL query evaluation (reference evaluator)"]
covers = "part"
note = "Wasm/Ops/StoreHandles.lean storeHandleQuery: queryParsedDatasetWith over the handle's dataset and backendOfRetained (LawfulDataset.ofDataset). Not covered: the literal and geo index plans, the retained-artifact selection."

[[entry]]
id = "wasm:vcEddsaCreateFromCanonical"
stages = ["vcSignStage"]
covers = "part"
note = "VC.DataIntegrity.createFromCanonical with Ed25519.sign: the first conjunct of SignContract. The caller gives the canonical forms; vcSignStage canonicalizes the datasets itself."

[[entry]]
id = "wasm:vcEddsaVerifyFromCanonical"
stages = ["vcVerifyStage"]
covers = "part"
note = "VC.DataIntegrity.verifyFromCanonical with Ed25519.verify: the first conjunct of VerifyContract, on caller-given canonical forms."

[[entry]]
id = "npm:.#update"
stages = ["updateStage"]
covers = "part"
note = "lib/dataset.mjs Dataset.update calls the wasm op datasetUpdate."

[[entry]]
id = "npm:.#canonicalize"
stages = ["rdfcStage"]
covers = "part"
note = "Dataset.toString('rdfc') calls datasetSerialize with tag rdfc, which runs canonicalizeOf."

[[entry]]
id = "npm:.#canonicalizeNQuads"
stages = ["rdfcStage"]
covers = "part"
note = "lib/pure.mjs calls the wasm op canonicalizeToNQuads."

[[entry]]
id = "npm:.#shaclValidate"
