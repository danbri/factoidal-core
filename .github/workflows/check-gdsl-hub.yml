name: GDSL one-language graph Hub and specification
on:
  pull_request:
    paths:
      - 'docs/specs/gdsl-0.2.md'
      - 'docs/specs/gssl-0.1.md'
      - 'docs/web/hub/gssl/**'
      - 'docs/.eleventy.js'
      - 'npm/factoidal/gdsl.*'
      - 'npm/factoidal/lib/gdsl-*.mjs'
      - 'tests/gdsl_hub.test.mjs'
      - '.github/workflows/check-gdsl-hub.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  gdsl-hub:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual graph runtime syntax and exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          node --check npm/factoidal/gdsl.mjs
          node --check npm/factoidal/lib/gdsl-graph.mjs
          node --check npm/factoidal/lib/gdsl-webgpu.mjs
          node --check docs/web/hub/gssl/graph-explorer.mjs
          node --check docs/web/hub/gssl/app.mjs
          mkdir -p "$RUNNER_TEMP/gdsl-hub"
          git rev-parse HEAD > "$RUNNER_TEMP/gdsl-hub/commit.txt"
          sha256sum docs/specs/gdsl-0.2.md docs/web/hub/gssl/*.mjs \
            npm/factoidal/gdsl.mjs npm/factoidal/lib/gdsl-*.mjs \
            tests/gdsl_hub.test.mjs > "$RUNNER_TEMP/gdsl-hub/source.sha256"
      - name: Common syntax, five examples, Hub frontend and package surface
        run: |
          node --test tests/gdsl_hub.test.mjs
          node --test npm/factoidal/test/gdsl.test.mjs
      - name: Install offline Eleventy from vendored cache
        run: bash third_party/eleventy/install.sh docs
      - name: Render and inspect the actual published site layout
        shell: bash
        run: |
          set -euo pipefail
          ( cd docs && node_modules/.bin/eleventy --quiet --output=_site ) \
            > "$RUNNER_TEMP/gdsl-hub/site-build.log" 2>&1 || {
              tail -n 100 "$RUNNER_TEMP/gdsl-hub/site-build.log"
              exit 1
            }
          for f in \
            docs/_site/web/hub/gssl/index.html \
            docs/_site/web/hub/gssl/graph-explorer.mjs \
            docs/_site/web/hub/gssl/app.mjs \
            docs/_site/web/hub/gssl/style.css \
            docs/_site/npm/factoidal/gdsl.mjs \
            docs/_site/npm/factoidal/lib/gdsl-graph.mjs \
            docs/_site/npm/factoidal/lib/gdsl-webgpu.mjs \
            docs/_site/npm/factoidal/lib/gdsl-examples.mjs \
            docs/_site/npm/factoidal/lib/gpu-resident.mjs
          do test -s "$f" || { echo "missing output: $f"; exit 1; }
          done
          grep -q 'gdsl-graph-title' docs/_site/web/hub/gssl/index.html
          grep -q 'gdsl-0.2.md' docs/_site/web/hub/gssl/index.html
          grep -q 'graph-explorer.mjs' docs/_site/web/hub/gssl/app.mjs
          grep -q 'gdsl.mjs' docs/_site/web/hub/gssl/graph-explorer.mjs
          grep -q 'GDSL' docs/_site/web/hub/index.html
          tail -n 7 "$RUNNER_TEMP/gdsl-hub/site-build.log"
      - name: Persist exact source and site evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdsl-graph-hub-evidence
          path: ${{ runner.temp }}/gdsl-hub/
          retention-days: 30
