name: Assurance registers (claims, host policy)

# Fast checks with no Lean build (batch https://github.com/danbri/factoidal-core/issues/1189):
# the claims register and statement freeze (issues 1178 and 1179), the Foafnaut host
# policy ratchet (issue 1188) with the rest of the host purity lint, the theorem count
# (issue 1186), and the tests of each tool. The `#print axioms` check of each claim needs
# the Lean build and runs in verify-lean4.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: assurance-registers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tool tests
        run: |
          python3 -I tests/foundation/test_claims_gate.py
          python3 -I tests/foundation/test_theorem_count.py
          python3 -I tests/foundation/test_foafnaut_host_policy.py
      - name: Claims register and statement freeze
        run: python3 -I tools/claims-gate.py
      - name: Host purity lint, Foafnaut host policy ratchet included
        run: bash tools/host-purity-lint.sh
      - name: Theorem count (report)
        run: python3 -I tools/theorem-count.py | tee -a "$GITHUB_STEP_SUMMARY"
