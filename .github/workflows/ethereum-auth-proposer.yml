name: Independent Lean authenticated proposer evidence
on:
  pull_request:
    paths:
      - 'formal/lean4/ethereum-consensus/**'
      - 'formal/lean4/L4Factoidal/Crypto/SHA2.lean'
      - '.github/workflows/ethereum-auth-proposer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticated-proposer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: formal/lean4/ethereum-consensus
    env:
      LEAN_NUM_THREADS: '2'
      LEAN_STACK_SIZE_KB: '65536'
      LAKE_ARTIFACT_CACHE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean4/ethereum-consensus
          build: false
          axiom-audit: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Independent fixture and signature oracle
        run: |
          set -euo pipefail
          node scripts/check-auth-proposer.mjs --self-test | tee "$RUNNER_TEMP/auth-proposer-oracle.log"
      - name: Audit and compile actual combined module graph
        run: |
          set -euo pipefail
          ulimit -v 8388608
          ulimit -c 0
          lean --version | tee "$RUNNER_TEMP/auth-proposer-toolchain.log"
          export LEAN_PATH="$RUNNER_TEMP/auth-proposer-build"
          mkdir -p "$LEAN_PATH"
          python3 - <<'PY' | tee "$RUNNER_TEMP/auth-proposer-build.log"
          import json, os, pathlib, re, runpy, subprocess
          p = pathlib.Path.cwd()
          out = pathlib.Path(os.environ["LEAN_PATH"])
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          a = runpy.run_path(str(p/"scripts/check-pure-lean-dependencies.py"))
          a["config_roots"](p)
          repo = pathlib.Path(subprocess.check_output(["git","rev-parse","--show-toplevel"],text=True).strip())
          def git(*args): return subprocess.check_output(["git",*args],text=True).strip()
          pins, graph, ordered, pending = {}, {}, [], set()
          standalone = {"AuthenticatedProposerMain","ProposerProjection","AuthenticatedProposer","BLSVerify","G1PublicKey","G2Signature","PairingTarget","HashToField"}
          def source(m):
              base = p.parent if m in a["SHA2_MODULES"] else p
              return base, a["module_path"](base,m,".lean")
          def pin(path):
              rel = str(path.resolve().relative_to(repo))
              sha = git("hash-object",str(path))
              assert sha == git("rev-parse","HEAD:"+rel), rel
              pins[rel] = sha
          def visit(m):
              if a["bundled"](m) or m in graph: return
              assert m in standalone or m.startswith("EthereumConsensus.") or m in a["SHA2_MODULES"],m
              assert m not in pending,m
              pending.add(m)
              base,path=source(m)
              assert path.resolve()==path and path.is_file(),m
              code=a["mask_comments_and_strings"](path.read_text())
              assert not re.search(r"\b(sorry|admit|native_decide|unsafe)\b|^\s*(axiom|partial\s+def)\b",code,re.M),m
              deps=a["direct_imports"](path)
              for d in sorted(deps): visit(d)
              pending.remove(m)
              graph[m]=sorted(deps)
              ordered.append(m)
              pin(path)
          visit("AuthenticatedProposerMain")
          for name in ["lean-toolchain","lake-manifest.json","lakefile.toml","../lean-toolchain",
                       "scripts/check-pure-lean-dependencies.py","scripts/check-proposer-slashing.py",
                       "scripts/auth-proposer-fixtures.py","scripts/check-auth-proposer.mjs",
                       "../../../.github/workflows/ethereum-auth-proposer.yml"]:
              pin(p/name)
          evidence={"head":git("rev-parse","HEAD"),"tree":git("rev-parse","HEAD^{tree}"),"source_pins":pins,"graph":graph}
          (temp/"auth-proposer-pins.json").write_text(json.dumps(evidence,sort_keys=True))
          print(json.dumps(evidence,sort_keys=True),flush=True)
          cs=[]
          for m in ordered:
              base,path=source(m)
              o=a["module_path"](out,m,".olean")
              o.parent.mkdir(parents=True,exist_ok=True)
              c=a["module_path"](out,m,".c")
              deps=subprocess.check_output(["lean","--root="+str(base),"--deps",str(path)],text=True)
              (temp/("auth-proposer-"+m+"-imports.log")).write_text(deps)
              toolchain=pathlib.Path(subprocess.check_output(["lean","--print-prefix"],text=True).strip()).resolve()
              for entry in deps.splitlines():
                  d=pathlib.Path(entry).resolve()
                  assert d.is_relative_to(out) or d.is_relative_to(toolchain),entry
              proc=subprocess.run(["lean","--root="+str(base),"-o",str(o),"-c",str(c),str(path)],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (temp/("auth-proposer-"+m+"-axioms.log")).write_text(proc.stdout)
              print(proc.stdout,flush=True)
              proc.check_returncode()
              cs.append(str(c))
          subprocess.run([str(toolchain/"bin/leanc"),"-O2","-o",str(out/"authenticated-proposer"),*cs],check=True)
          print(a["audit_binary"](out/"authenticated-proposer",toolchain),flush=True)
          PY
      - name: Actual theorem reports and falsification controls
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$RUNNER_TEMP/auth-proposer-axiom-audit.log"
          import os,pathlib,re
          log=(pathlib.Path(os.environ["RUNNER_TEMP"])/"auth-proposer-AuthenticatedProposer-axioms.log").read_text()
          prefix="EthereumConsensus.SSZ.AuthenticatedProposer."
          expected={prefix+n for n in ("preparation_error","first_failure","first_mismatch","second_failure","second_mismatch","authenticate_success","state_success")}
          def audit(s):
              rows=re.findall(r"'(EthereumConsensus\.SSZ\.AuthenticatedProposer\.\w+)' (?:depends on axioms: \[([^]]*)\]|does not depend on any axioms)",s)
              if len(rows)!=len(expected) or {n for n,_ in rows}!=expected: raise ValueError("inventory")
              for n,v in rows:
                  if not set(filter(None,(x.strip() for x in v.split(",")))) <= {"propext","Classical.choice","Quot.sound"}: raise ValueError(n)
          audit(log)
          for bad in ["",log+log,log.replace(prefix+"state_success",prefix+"other"),
                      re.sub(r"('(EthereumConsensus\.SSZ\.AuthenticatedProposer\.\w+)') (?:depends on axioms: \[[^]]*\]|does not depend on any axioms)",r"\1 depends on axioms: [sorryAx]",log,count=1)]:
              try: audit(bad)
              except ValueError: continue
              raise ValueError("mutation escaped")
          print("Seven actual theorem reports and four axiom controls passed")
          PY
      - name: Projection theorem reports and falsification controls
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$RUNNER_TEMP/auth-proposer-projection-axiom-audit.log"
          import os,pathlib,re
          log=(pathlib.Path(os.environ["RUNNER_TEMP"])/"auth-proposer-ProposerProjection-axioms.log").read_text()
          prefix="EthereumConsensus.SSZ.ProposerProjection."
          expected={prefix+n for n in ("mark_overflow","mark_checked","authentication_error","authentication_success")}
          def audit(s):
              rows=re.findall(r"'(EthereumConsensus\.SSZ\.ProposerProjection\.\w+)' (?:depends on axioms: \[([^]]*)\]|does not depend on any axioms)",s)
              if len(rows)!=len(expected) or {n for n,_ in rows}!=expected: raise ValueError("inventory")
              for n,v in rows:
                  if not set(filter(None,(x.strip() for x in v.split(",")))) <= {"propext","Classical.choice","Quot.sound"}: raise ValueError(n)
          audit(log)
          for bad in ["",log+log,log.replace(prefix+"authentication_error",prefix+"other"),
                      re.sub(r"('(EthereumConsensus\.SSZ\.ProposerProjection\.\w+)') (?:depends on axioms: \[[^]]*\]|does not depend on any axioms)",r"\1 depends on axioms: [sorryAx]",log,count=1)]:
              try: audit(bad)
              except ValueError: continue
              raise ValueError("mutation escaped")
          print("Four actual projection theorem reports and four axiom controls passed")
          PY
      - name: Native raw proposer authentication
        run: |
          set -euo pipefail
          ulimit -v 8388608
          ulimit -c 0
          node scripts/check-auth-proposer.mjs "$RUNNER_TEMP/auth-proposer-build/authenticated-proposer" | tee "$RUNNER_TEMP/auth-proposer-native.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-auth-proposer-evidence
          path: |
            ${{ runner.temp }}/auth-proposer-*.log
            ${{ runner.temp }}/auth-proposer-pins.json
