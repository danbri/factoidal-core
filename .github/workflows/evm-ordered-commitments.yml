name: Independent Lean ordered execution commitments
on:
  pull_request:
    paths:
      - 'formal/lean4/evm-cleanroom/**'
      - '.github/workflows/evm-ordered-commitments.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordered:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: formal/lean4
    env:
      LEAN_NUM_THREADS: '1'
      LEAN_STACK_SIZE_KB: '65536'
      MIMALLOC_ARENA_RESERVE: '67108864'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean4/evm-cleanroom
          build: false
          axiom-audit: false
          test: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build native path and audit actual axiom reports
        run: |
          set -euo pipefail
          ulimit -v 8388608
          mkdir -p "$RUNNER_TEMP/ordered"
          git rev-parse HEAD | tee "$RUNNER_TEMP/ordered/source.txt"
          git rev-parse HEAD^{tree} | tee -a "$RUNNER_TEMP/ordered/source.txt"
          git hash-object evm-cleanroom/EVMCleanroom/{OrderedCommitments,OrderedCommitmentTestCLI,SignedTransaction,TransactionList,MPT,Keccak,SecpRecovery}.lean evm-cleanroom/lakefile-ordered-commitments.toml evm-cleanroom/scripts/witness/check-native-ordered-commitments.mjs | tee -a "$RUNNER_TEMP/ordered/source.txt"
          lean --version
          lake -d evm-cleanroom -f lakefile-ordered-commitments.toml build evm-ordered-commitment-test 2>&1 | tee "$RUNNER_TEMP/ordered/build.log"
          lake -d evm-cleanroom -f lakefile-ordered-commitments.toml env lean "$PWD/evm-cleanroom/EVMCleanroom/OrderedCommitments.lean" 2>&1 | tee "$RUNNER_TEMP/ordered/axioms.log"
          python3 - "$RUNNER_TEMP/ordered/axioms.log" <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          names = ('checked_source', 'child_inline', 'child_hash')
          for name in names:
              rows = [line for line in text.splitlines() if "'EVMCleanroom.OrderedCommitments." + name + "'" in line]
              assert len(rows) == 1, (name, rows)
              line = rows[0]
              if 'does not depend on any axioms' in line: continue
              m = re.search(r'depends on axioms: \[([^\]]*)\]', line)
              assert m and set(x.strip() for x in m[1].split(',')) <= {'propext','Quot.sound','Classical.choice'}, line
          PY
          sha256sum evm-cleanroom/.lake/build/bin/evm-ordered-commitment-test | tee "$RUNNER_TEMP/ordered/binary.sha256"
      - name: Inspect actual native runtime and exact text entry symbols
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/ordered/binary.sha256"
          python3 - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("audit","evm-cleanroom/scripts/check-witness-runtime.py")
          audit=importlib.util.module_from_spec(spec); spec.loader.exec_module(audit)
          print(json.dumps(audit.selftest()))
          name="evm-ordered-commitment-test"
          binary=Path("evm-cleanroom/.lake/build/bin")/name
          nm,_=audit.command(["nm","--demangle","--no-sort",str(binary)])
          symbols=audit.symbols_from_nm(nm)
          defined={n for n,k in symbols if k in ("T","t")}
          entries=["lp_evm__cleanroom_EVMCleanroom_"+n for n in ("OrderedCommitments_run","OrderedCommitments_root","SignedTransaction_run")]
          selected=set()
          for entry in entries:
              choices=[n for n in (entry,entry+"___redArg") if n in defined]
              assert choices, entry
              selected.add(choices[0])
          audit.REQUIRED_SYMBOLS[name]=audit.COMMON_SYMBOLS | selected | {"initialize_evm__cleanroom_EVMCleanroom_OrderedCommitmentTestCLI"}
          report=audit.inspect_binary(name,binary,audit.digest(binary.read_bytes()))
          Path(os.environ["RUNNER_TEMP"],"ordered","runtime.json").write_text(json.dumps(report,indent=2))
          assert report["passed"],report
          PY
      - name: Install existing pinned test oracles
        run: |
          set -euo pipefail
          printf 'cc95a62e125486d2de9a28cb5fc61c098b955aa22c2dd0b3dc0b19f2df770425  evm-cleanroom/scripts/differential/package-lock.json\n' | sha256sum --check
          npm ci --prefix evm-cleanroom/scripts/differential --ignore-scripts --no-audit --no-fund
      - name: Compare actual checked execution with retained reference commitments
        run: |
          set -euo pipefail
          ulimit -v 8388608
          sha256sum --check "$RUNNER_TEMP/ordered/binary.sha256"
          node evm-cleanroom/scripts/witness/check-native-ordered-commitments.mjs "$PWD/evm-cleanroom/.lake/build/bin/evm-ordered-commitment-test" | tee "$RUNNER_TEMP/ordered/results.json"
          sha256sum --check "$RUNNER_TEMP/ordered/binary.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordered-commitment-evidence
          path: ${{ runner.temp }}/ordered
