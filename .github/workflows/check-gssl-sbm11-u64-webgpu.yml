name: GSSL SBM11 UInt64 WebGPU lanes

on:
  pull_request:
    paths:
      - 'formal/lean4/L4Factoidal/GpuDomainSpecificLanguage/Sbm11U64Lanes.lean'
      - 'formal/lean4/L4Factoidal/Storage/DeltaLog.lean'
      - 'tools/gssl-sbm11-webgpu.mjs'
      - 'tools/gssl-sbm11-dense-u32.mjs'
      - 'tools/gssl-sbm11-webgpu-smoke.mjs'
      - 'tests/gssl_sbm11_u64_test.mjs'
      - '.github/workflows/check-gssl-sbm11-u64-webgpu.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Verify host code, shader sources and exact PR head
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/gssl-sbm11-webgpu.mjs
          node --check tools/gssl-sbm11-dense-u32.mjs
          node --check tools/gssl-sbm11-webgpu-smoke.mjs
          node --check tests/gssl_sbm11_u64_test.mjs
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p "$RUNNER_TEMP/gssl-u64"
          git rev-parse HEAD | tee "$RUNNER_TEMP/gssl-u64/commit.txt"
          sha256sum tools/gssl-sbm11-webgpu.mjs \
            tools/gssl-sbm11-dense-u32.mjs \
            tools/gssl-sbm11-webgpu-smoke.mjs \
            formal/lean4/L4Factoidal/GpuDomainSpecificLanguage/Sbm11U64Lanes.lean \
            tests/gssl_sbm11_u64_test.mjs | tee "$RUNNER_TEMP/gssl-u64/source.sha256"
      - name: Strict pure JavaScript u64 lane and BGP tests
        run: node --test tests/gssl_sbm11_u64_test.mjs
      - name: Install Mesa software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          dpkg-query -W libvulkan1 mesa-vulkan-drivers
      - name: Execute count scan emit on real WebGPU (software Vulkan)
        shell: bash
        run: |
          set -euo pipefail
          driver="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$driver"
          export DENO_WEBGPU_BACKEND=vulkan VK_DRIVER_FILES="$driver"
          export XDG_RUNTIME_DIR
          XDG_RUNTIME_DIR="$(mktemp -d "$RUNNER_TEMP/gssl-u64-xdg.XXXXXX")"
          timeout --kill-after=10s 240s deno run --no-config --no-npm --unstable-webgpu \
            tools/gssl-sbm11-webgpu-smoke.mjs "$SOURCE_COMMIT" \
            | tee "$RUNNER_TEMP/gssl-u64/device.json"
      - name: Save exact-source device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gssl-sbm11-u64-device-evidence
          path: ${{ runner.temp }}/gssl-u64/
          if-no-files-found: warn
          retention-days: 30
