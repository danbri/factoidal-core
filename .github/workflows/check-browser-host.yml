name: Browser host controls
on:
  push:
    branches: [claude/check-portable-network-pool-fixture]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  net-pool:
    name: Network pool on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          sparse-checkout: |
            labs/demos/foafnaut/native_net.ts
            labs/demos/foafnaut/native_net_pool_test.ts
            labs/demos/foafnaut/native_net_dns_test.ts
          sparse-checkout-cone-mode: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Reproduce old fixture
        continue-on-error: true
        working-directory: labs/demos/foafnaut
        run: |
          git show HEAD~2:labs/demos/foafnaut/native_net_pool_test.ts > baseline_pool_test.ts
          deno test --allow-net --allow-run --allow-read --allow-write --filter 'two origins' baseline_pool_test.ts
      - name: Verify patched fixture
        working-directory: labs/demos/foafnaut
        run: deno test --allow-net --allow-run --allow-read --allow-write native_net_pool_test.ts native_net_dns_test.ts
