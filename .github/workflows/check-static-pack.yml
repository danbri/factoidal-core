name: Static pack Lean check

on:
  push:
    branches: [wip/604-static-pack-spec]
    paths:
      - 'formal/lean4/L4Factoidal/GpuKernel/StaticPack.lean'
      - 'formal/lean4/Harness/StaticPackCpu.lean'
      - 'formal/lean4/lean-toolchain'
      - 'tools/lean-hygiene-audit.py'
      - 'tools/lean-partial-def-baseline.txt'
      - '.github/workflows/check-static-pack.yml'
  pull_request:
    paths:
      - 'formal/lean4/L4Factoidal/GpuKernel/StaticPack.lean'
      - 'formal/lean4/Harness/StaticPackCpu.lean'
      - 'formal/lean4/lean-toolchain'
      - 'tools/lean-hygiene-audit.py'
      - 'tools/lean-partial-def-baseline.txt'
      - '.github/workflows/check-static-pack.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  static-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Lean reserves 1 GiB per runtime thread by default on this toolchain.
      # A small proof module needs only a bounded 16 MiB stack per worker.
      LEAN_STACK_SIZE_KB: 16384
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
          lake-package-directory: formal/lean4

      - name: Compile StaticPack and print its reported theorem axioms
        working-directory: formal/lean4
        shell: bash
        run: |
          set -euo pipefail
          unset LEAN_PATH LEAN_SRC_PATH
          proof_dir="$RUNNER_TEMP/static-pack-evidence"
          module=L4Factoidal/GpuKernel/StaticPack.lean
          olean="$proof_dir/modules/${module%.lean}.olean"
          mkdir -p "$(dirname "$olean")"
          {
            git rev-parse HEAD
            uname -sm
            cat lean-toolchain
            sha256sum lean-toolchain "$module" Harness/StaticPackCpu.lean
          } 2>&1 | tee "$proof_dir/source.txt"
          (ulimit -v 4194304; exec timeout --kill-after=5s 30s lean --version) \
            2>&1 | tee "$proof_dir/lean-version.txt"

          compile=(timeout --kill-after=10s 180s /usr/bin/time -v -o "$proof_dir/time.txt"
                   lean -j1 -s16384 -M2048 -DwarningAsError=true -o "$olean" "$module")
          {
            printf 'ulimit -v 4194304\n'
            printf ' %q' "${compile[@]}"
            printf '\n'
          } | tee "$proof_dir/command.txt"

          set +e
          (
            set -e
            ulimit -v 4194304
            exec "${compile[@]}"
          ) 2>&1 | tee "$proof_dir/lean.log"
          status=("${PIPESTATUS[@]}")
          set -e
          printf 'compile_exit=%s\ntee_exit=%s\n' "${status[@]}" | tee "$proof_dir/exit.txt"
          test "${status[0]}" -eq 0
          test "${status[1]}" -eq 0
          test -s "$olean"

      - name: Audit the source and reported axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/static-pack-evidence"
          python3 tools/lean-hygiene-audit.py --build-log "$proof_dir/lean.log" \
            2>&1 | tee "$proof_dir/hygiene.log"
          # Require evidence for the public claims, not merely a nonempty axiom log.
          for name in packSpec_length scanFrom_length scanFrom_cons scanFrom_prefix \
                      scan_terminal scanFrom_bounds scanFrom_disjoint admitted_total_fits \
                      admitted_word_bounds scatter_eq_scatterRow scatter_frame \
                      packParallel_eq_packSpec packParallel_position packChecked_eq \
                      packWithFallback_eq_packSpec; do
            grep -Eq "'L4Factoidal.GpuKernel.StaticPack.$name' (depends on axioms:|does not depend on any axioms)" \
              "$proof_dir/lean.log" || { echo "Missing checked theorem: $name"; exit 1; }
            printf '%s\n' "L4Factoidal.GpuKernel.StaticPack.$name" >> "$proof_dir/checked-theorems.txt"
          done

      - name: Run the ordinary CPU specification on fixed fixtures
        working-directory: formal/lean4
        shell: bash
        run: |
          set -euo pipefail
          unset LEAN_SRC_PATH
          proof_dir="$RUNNER_TEMP/static-pack-evidence"
          export LEAN_PATH="$proof_dir/modules"
          cpu=(timeout --kill-after=10s 180s /usr/bin/time -v -o "$proof_dir/cpu-time.txt"
               lean -j1 -s16384 -M2048 -DwarningAsError=true --run Harness/StaticPackCpu.lean)
          {
            printf 'export LEAN_PATH=%q\nulimit -v 4194304\n' "$LEAN_PATH"
            printf ' %q' "${cpu[@]}"
            printf '\n'
          } | tee "$proof_dir/cpu-command.txt"

          set +e
          (
            set -e
            ulimit -v 4194304
            exec "${cpu[@]}"
          ) 2>"$proof_dir/cpu-stderr.log" | tee "$proof_dir/cpu.jsonl"
          status=("${PIPESTATUS[@]}")
          set -e
          printf 'cpu_exit=%s\ntee_exit=%s\n' "${status[@]}" | tee "$proof_dir/cpu-exit.txt"
          cat "$proof_dir/cpu-stderr.log"
          test "${status[0]}" -eq 0
          test "${status[1]}" -eq 0

          python3 - "$proof_dir/cpu.jsonl" 2>&1 <<'PY' | tee "$proof_dir/cpu-fixtures.log"
          import json
          import sys
          from pathlib import Path

          expected = [
              {"case": "empty", "words": []},
              {"case": "zero_counts", "words": []},
              {"case": "singleton", "words": [0]},
              {"case": "mixed_counts", "words": [8, 3, 8, 0, 4294967295, 3]},
              {"case": "all_nonempty", "words": [3, 2, 1, 0]},
          ]
          actual = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines()]
          if actual != expected:
              sys.exit(f"CPU fixture mismatch\nExpected {expected!r}\nActual {actual!r}")
          print(f"{len(actual)} CPU runtime fixtures passed")
          PY

      - name: Preserve compiler, axiom and CPU fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-pack-lean-evidence
          path: |
            ${{ runner.temp }}/static-pack-evidence/
            !${{ runner.temp }}/static-pack-evidence/modules/**
          if-no-files-found: warn
          retention-days: 30
