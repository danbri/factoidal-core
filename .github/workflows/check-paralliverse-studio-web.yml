name: Paralliverse Studio Wasm and browser

on:
  push:
    branches: [wip/paralliverse-studio]
    paths: ['.github/workflows/check-paralliverse-studio-web.yml']
  workflow_dispatch:
    inputs:
      core_ref:
        description: Exact source commit or branch to build and exercise
        required: true
        type: string
        default: wip/paralliverse-studio

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_STACK_SIZE_KB: 16384
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.core_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-builds
          path: runtime-cache-source
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
          lake-package-directory: formal/lean4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check device-loss event interleavings
        run: node --test tests/hub/paralliverse-studio-device-loss.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-6.0.8-${{ runner.os }}
      - name: Prepare pinned tools and runtime cache
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/paralliverse-studio-web"
          mkdir -p "$evidence"
          printf 'EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          git rev-parse HEAD | tee "$evidence/commit.txt"
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libvulkan1 mesa-vulkan-drivers
          if [ ! -x ~/emsdk/emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk ~/emsdk
          fi
          ~/emsdk/emsdk install 6.0.8
          ~/emsdk/emsdk activate 6.0.8
          toolchain=$(sed 's|.*:||' formal/lean4/lean-toolchain | tr -d ' \n')
          git -C runtime-cache-source fetch -q origin toolchain-cache
          git -C runtime-cache-source rev-parse origin/toolchain-cache > "$evidence/runtime-cache-commit.txt"
          git -C runtime-cache-source show "origin/toolchain-cache:l4wasm-work-cache-$toolchain.tar.gz" | tar -xz -C "$HOME"
      - name: Install ancestor assets for the unchanged Hub routes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The Studio runtime is rebuilt below. Other Hub routes keep their
          # ancestor assets; refuse any source drift outside this component.
          tools/fetch-builds.sh --set web 2>&1 | tee "$EVIDENCE/base-web.log"
          python3 - <<'PY'
          import json, pathlib, subprocess, os
          manifest = json.loads(pathlib.Path('docs/web/hub/assets/l4/paralliverse/manifest.json').read_text())
          base = manifest['sourceCommit']
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD', '--', 'formal/lean4', 'npm'], text=True).splitlines()
          exact = {'formal/lean4/lakefile.lean', 'formal/lean4/Wasm/ParalliverseHub.lean',
                   'formal/lean4/Wasm/build-paralliverse.sh', 'formal/lean4/Wasm/paralliverse-smoke.mjs',
                   # These parent-PR changes contain model theorems only.
                   'formal/lean4/L4Factoidal/Storage/Sbm11/OrderedScanTheorems.lean',
                   'formal/lean4/L4Factoidal/Storage/Sbm11/ParallelScanTheorems.lean'}
          prefixes = ('formal/lean4/L4Factoidal/Paralliverse/', 'formal/lean4/Harness/Paralliverse')
          unrelated = [p for p in changed if p not in exact and not p.startswith(prefixes)]
          if unrelated:
              raise SystemExit('Unrelated runtime drift: ' + ', '.join(unrelated))
          pathlib.Path(os.environ['EVIDENCE'], 'ancestor-assets.json').write_text(json.dumps({'sourceCommit': base, 'componentChanges': changed}, indent=2))
          PY
          tools/fetch-builds.sh --set foafnaut-web 2>&1 | tee "$EVIDENCE/base-scenes.log"
      - name: Build and exercise the exact Studio Wasm ABI
        id: studio-runtime
        working-directory: formal/lean4
        shell: bash
        run: |
          set -euo pipefail
          source ~/emsdk/emsdk_env.sh
          # Older runtime caches predate the checked wasm32 object witness.
          # The existing runtime-only bootstrap repairs and verifies that cache;
          # it does not build or install the full Factoidal library.
          L4_WASM_RUNTIME_ONLY=1 timeout --kill-after=10s 900s bash Wasm/build-wasm.sh "$HOME/l4wasm-work" \
            2>&1 | tee "$EVIDENCE/runtime-bootstrap.log"
          timeout --kill-after=10s 900s bash Wasm/build-paralliverse.sh "$HOME/l4wasm-work" \
            2>&1 | tee "$EVIDENCE/wasm-build.log"
          cp ../../docs/web/hub/assets/l4/paralliverse/manifest.json "$EVIDENCE/manifest.json"
          python3 - <<'PY'
          import json, pathlib, subprocess
          manifest = json.loads(pathlib.Path('../../docs/web/hub/assets/l4/paralliverse/manifest.json').read_text())
          assert manifest['sourceCommit'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          PY
      - name: Produce independent native Lean device fixtures
        working-directory: formal/lean4
        shell: bash
        run: |
          set -euo pipefail
          unset LEAN_SRC_PATH
          export LEAN_PATH="$RUNNER_TEMP/studio-native-oleans"
          mkdir -p "$LEAN_PATH"
          python3 ../../tools/lean-module-closure.py --lean-dir . Harness.ParalliverseStudioFixtures > "$EVIDENCE/native-modules.txt"
          ulimit -v 4194304
          args=(-j1 -s16384 -M2048 -DwarningAsError=true)
          while IFS= read -r module; do
            target="$LEAN_PATH/${module%.lean}.olean"
            mkdir -p "$(dirname "$target")"
            timeout --kill-after=10s 180s lean "${args[@]}" -o "$target" "$module"
          done < "$EVIDENCE/native-modules.txt"
          timeout --kill-after=10s 180s lean "${args[@]}" --run Harness/ParalliverseStudioFixtures.lean \
            | tee "$EVIDENCE/native-runtime.log"
          timeout --kill-after=10s 180s lean "${args[@]}" --run Harness/ParalliverseStudioFixtures.lean --emit-device \
            > "$EVIDENCE/native-device.jsonl"
      - name: Compare actual WebGPU whole buffers with native Lean
        shell: bash
        run: |
          set -euo pipefail
          driver=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$driver"
          export DENO_WEBGPU_BACKEND=vulkan VK_DRIVER_FILES="$driver"
          export XDG_RUNTIME_DIR
          XDG_RUNTIME_DIR=$(mktemp -d "$RUNNER_TEMP/studio-xdg.XXXXXX")
          timeout --kill-after=10s 180s deno run --no-config --no-npm --unstable-webgpu \
            --allow-read="$EVIDENCE/native-device.jsonl" tools/paralliverse-studio-device-smoke.mjs \
            "$EVIDENCE/native-device.jsonl" "$(cat "$EVIDENCE/commit.txt")" \
            2>"$EVIDENCE/device.log" | tee "$EVIDENCE/device.json"
      - name: Build and exercise the real Hub page
        shell: bash
        env:
          REQUIRE_EXACT_PARALLIVERSE_RUNTIME: '1'
          REQUIRE_PARALLIVERSE_STUDIO: '1'
        run: |
          set -euo pipefail
          tools/premerge.sh --changed --base origin/main 2>&1 | tee "$EVIDENCE/premerge.log"
          third_party/eleventy/install.sh docs
          (cd docs && npx --offline @11ty/eleventy --quiet --output=_site) \
            2>&1 | tee "$EVIDENCE/eleventy.log"
          timeout --kill-after=10s 300s node tools/paralliverse-browser-smoke.mjs \
            docs/_site "$EVIDENCE/browser" "$(cat "$EVIDENCE/commit.txt")" \
            2>&1 | tee "$EVIDENCE/browser.log"
      - name: Preserve Studio runtime and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paralliverse-studio-web-evidence
          path: ${{ runner.temp }}/paralliverse-studio-web/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve the built runtime
        if: always() && steps.studio-runtime.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: paralliverse-studio-runtime
          path: docs/web/hub/assets/l4/paralliverse/
          retention-days: 7
