name: Verify Lean 4 corpus

# The Lean tree contains executable semantics, proof modules, and build-time
# #guard tests.  A focused executable build is not a substitute for checking
# the whole package: this workflow builds `L4Factoidal` and `l4wasm` as a
# visible repository gate.
on:
  push:
    branches:
      - main
      - claude/core-split
  pull_request:
    paths:
      - 'formal/lean4/**'
      - 'tests/assurance/**'
      - 'tools/check-owl-reader-contracts.py'
      - 'tools/check-atomic-direct-corpus.py'
      - 'tools/check-owl-public-boundary.py'
      - 'tools/check-owl-public-artifact.mjs'
      - 'tools/test-owl-public-artifact.mjs'
      - 'tools/lean-*'
      - 'tools/test_lean_*'
      - 'third_party/testing/owl/**'
      - '.github/workflows/verify-lean4.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-lean4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lake build (full Lean corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The package's lean-toolchain is authoritative.  Keep setup separate
      # from the command below so the exact full-corpus gate is explicit.
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          lake-package-directory: formal/lean4

      - name: Build library, proofs, and build-time guards
        working-directory: formal/lean4
        shell: bash
        run: |
          set -o pipefail
          # l4wasm owns public producer guards (including CSVW/RIF refusal).
          # They are not in the L4Factoidal library's import closure.
          # The csimp real-build controls also inspect QlvrTool.runSideIndex,
          # declared in Harness.Qlvr outside both import closures. Build its
          # Lean/C artifacts; the native l4qlvr executable is not needed.
          # The source-wide csimp inventory also includes CryptoProbe.
          lake build L4Factoidal l4wasm +Harness.Qlvr +Harness.CryptoProbe 2>&1 | tee "$RUNNER_TEMP/lake-build.log"

      # `lake build` alone is NOT the soundness gate, and it was the whole
      # gate until 2026-09-03. A `sorry` fails the build, because Lean emits
      # it with an elaboration error. A DELIBERATE user `axiom` does not: it
      # compiles, and its appearance in a `#print axioms` line is an
      # informational message. The same holds for `native_decide`, `unsafe`,
      # `@[implemented_by]`, and for a new `partial def` — which compiles to
      # an opaque constant, so no theorem can be stated about the function it
      # declares (https://github.com/danbri/factoidal/issues/617).
      #
      # The audit reads the build log as well as the source, because a grep
      # cannot see through an import: a clean-looking theorem can rest on a
      # lemma in another file that carries the hatch, and only `#print axioms`
      # reports that. This workflow keeps no `.lake` cache, so every run
      # compiles and the log carries the `#print axioms` output. If it ever
      # does not, the audit FAILS with "NOTHING READ" instead of passing
      # quietly (anti-pattern 30).
      - name: Escape-hatch audit (sorry / axiom / native_decide / unsafe / partial def)
        working-directory: ${{ github.workspace }}
        run: python3 tools/lean-hygiene-audit.py --build-log "$RUNNER_TEMP/lake-build.log"

      - name: Compiled recursion and replacement audit controls
        run: |
          python3 tools/test_lean_tail_recursion_audit.py
          python3 tools/test_lean_csimp_reach.py

      - name: Gate compiled recursion and compiler replacement reach
        run: |
          python3 tools/lean-tail-recursion-audit.py --gate --json "$RUNNER_TEMP/lean-tail-recursion.json"
          python3 tools/lean-csimp-reach.py --gate --json "$RUNNER_TEMP/lean-csimp-reach.json"

      # These gates cover the restricted proved reader and generated-name
      # separation and restricted consistency source adapter. They do not
      # certify legacy entailment or an untested npm artifact.
      - name: OWL gate parser and resource-failure controls
        run: python3 -m unittest discover -s tests/assurance -p 'test_*.py' -v

      - name: OWL reader contracts, model witnesses, and proof mutations
        run: python3 tools/check-owl-reader-contracts.py --json "$RUNNER_TEMP/owl-reader-contracts.json"

      - name: Measure the restricted reader on the W3C OWL catalog
        run: python3 tools/check-atomic-direct-corpus.py --json "$RUNNER_TEMP/atomic-direct-w3c.json"

      - name: OWL consistency public producer and proof bypass controls
        run: python3 tools/check-owl-public-boundary.py --json "$RUNNER_TEMP/owl-public-boundary.json"

      - name: Preserve OWL assurance evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl-reader-assurance
          path: |
            ${{ runner.temp }}/owl-reader-contracts.json
            ${{ runner.temp }}/atomic-direct-w3c.json
            ${{ runner.temp }}/owl-public-boundary.json
            ${{ runner.temp }}/lean-tail-recursion.json
            ${{ runner.temp }}/lean-csimp-reach.json
          if-no-files-found: warn
          retention-days: 30

      # The two HACL* @[extern] families cannot be checked by a #guard: an
      # extern does not evaluate in the Lean interpreter that #guard runs in.
      # l4vc-probe is where they ARE checked — the RFC 8032 Ed25519 vectors,
      # and the `sha256 differential` section comparing Crypto.sha256Hacl with
      # the pure Lean Crypto.sha256 on the FIPS 180-4 vectors, the SHA-256
      # block/padding boundaries and a 1 MiB buffer. That equality is what
      # makes the storage host's substitution of the HACL* hasher into
      # Storage/BlockMerkle.lean sound, so it is a required gate. The probe
      # exits non-zero on any failure.
      # The same probe also runs the pinned VCDM fixtures. A plain checkout
      # leaves this submodule empty and correctly fails its inventory check.
      - name: Fetch pinned VC fixtures for the native probe
        run: git submodule update --init --depth 1 third_party/testing/vc

      - name: HACL* extern probe (Ed25519 vectors + sha256 differential)
        working-directory: formal/lean4
        run: lake exe l4vc-probe

      # RDF Data Cube 2014: normalization and IC-0 to IC-21, each checked by the
      # Recommendation's SPARQL texts and by the direct Lean functions, which
      # must agree on every fixture (https://github.com/danbri/factoidal/issues/1165).
      - name: RDF Data Cube integrity constraints (tests/datacube/run.sh)
        run: bash tests/datacube/run.sh
