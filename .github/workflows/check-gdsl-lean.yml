name: GDSL common dataflow Lean graph model
on:
  pull_request:
    paths:
      - 'formal/lean4/L4Factoidal/GpuDomainSpecificLanguage/Graph.lean'
      - 'formal/lean4/L4Factoidal/GpuDomainSpecificLanguage/GraphAdmission.lean'
      - 'formal/lean4/L4Factoidal/GpuDomainSpecificLanguage/GraphWords.lean'
      - 'formal/lean4/L4Factoidal/GpuDomainSpecificLanguage/GraphJson.lean'
      - 'formal/lean4/L4Factoidal/GpuDomainSpecificLanguage/GraphEvaluate.lean'
      - 'formal/lean4/L4Factoidal/GpuDomainSpecificLanguage/PVGraph.lean'
      - '.github/workflows/check-gdsl-lean.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  formal:
    uses: ./.github/workflows/check-dataflow-stage.yml
    with:
      group: gdsl-common-dataflow
      timeout_minutes: 12
      modules: >-
        L4Factoidal.GpuDomainSpecificLanguage.Graph
        L4Factoidal.GpuDomainSpecificLanguage.GraphAdmission
        L4Factoidal.GpuDomainSpecificLanguage.GraphWords
        L4Factoidal.GpuDomainSpecificLanguage.GraphJson
        L4Factoidal.GpuDomainSpecificLanguage.GraphEvaluate
        L4Factoidal.GpuDomainSpecificLanguage.PVGraph
      theorems: >-
        L4Factoidal.GpuDomainSpecificLanguage.Graph.linksAdmitted_sound
        L4Factoidal.GpuDomainSpecificLanguage.GraphAdmission.admitted_unique_node_ids
        L4Factoidal.GpuDomainSpecificLanguage.GraphAdmission.admitted_unique_producers
        L4Factoidal.GpuDomainSpecificLanguage.GraphAdmission.admitted_edges
        L4Factoidal.GpuDomainSpecificLanguage.GraphAdmission.admitted_all_input_ports_bound
        L4Factoidal.GpuDomainSpecificLanguage.GraphAdmission.admitted_core_signatures
        L4Factoidal.GpuDomainSpecificLanguage.GraphWords.mapAdd_length
        L4Factoidal.GpuDomainSpecificLanguage.GraphWords.mapMul_length
        L4Factoidal.GpuDomainSpecificLanguage.GraphWords.mapXor_length
        L4Factoidal.GpuDomainSpecificLanguage.GraphWords.scan_length
        L4Factoidal.GpuDomainSpecificLanguage.GraphWords.broadcast_length
        L4Factoidal.GpuDomainSpecificLanguage.GraphJson.certified_sound
        L4Factoidal.GpuDomainSpecificLanguage.PVGraph.admitted_sound
