name: Independent Lean header RLP and computed parent hash
on:
  pull_request:
    paths:
      - "formal/lean4/evm-cleanroom/**"
      - ".github/workflows/evm-header-rlp.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  header-rlp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean4/evm-cleanroom
          build: false
          axiom-audit: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build native Lean executable and audit proofs
        working-directory: formal/lean4/evm-cleanroom
        env:
          LEAN_STACK_SIZE_KB: "65536"
          MIMALLOC_ARENA_RESERVE: "67108864"
        run: |
          set -o pipefail
          ulimit -v 8388608
          lake -f lakefile-header-rlp.toml build evm-header-rlp
          lake -f lakefile-header-rlp.toml env lean EVMCleanroom/HeaderRLP.lean | tee /tmp/header-rlp-axioms.txt
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          expected=set("layout_refused shape_refused wire_exact hash_exact parent_refused child_refused pair_connected".split())
          allowed={"propext","Classical.choice","Quot.sound"}
          actual={}
          for line in Path("/tmp/header-rlp-axioms.txt").read_text().splitlines():
              m=re.fullmatch(r"'EVMCleanroom\.HeaderRLP\.(\w+)' (?:depends on axioms: \[(.*?)\]|does not depend on any axioms)",line)
              if m:
                  assert m[1] not in actual
                  actual[m[1]]=set(filter(None,(m[2] or "").split(", ")))
          assert set(actual)==expected,actual
          assert all(a<=allowed for a in actual.values()),actual
          assert json.loads(Path("lake-manifest.json").read_text())["packages"]==[]
          paths=["EVMCleanroom/HeaderRLP.lean","EVMCleanroom/HeaderRLPCLI.lean","EVMCleanroom/HeaderChain.lean","EVMCleanroom/HeaderFees.lean","EVMCleanroom/Keccak.lean","EVMCleanroom/Memory.lean","EVMCleanroom/CLIEncoding.lean","lakefile-header-rlp.toml","scripts/differential/header-rlp.mjs","scripts/differential/package-lock.json","evidence/frontier-mainnet-46147.json"]
          pins={p:subprocess.check_output(["git","hash-object",p],text=True).strip() for p in paths}
          for p in paths:
              assert pins[p]==subprocess.check_output(["git","rev-parse","HEAD:formal/lean4/evm-cleanroom/"+p],text=True).strip()
          evidence={"tree":subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip(),"sources":pins,"actualAxioms":{k:sorted(v) for k,v in actual.items()}}
          Path("/tmp/header-rlp-claims.json").write_text(json.dumps(evidence,indent=2))
          print(json.dumps(evidence))
          PY
      - name: Independent RLP and Keccak oracle and mutation controls
        working-directory: formal/lean4/evm-cleanroom/scripts/differential
        run: |
          set -o pipefail
          npm ci
          node header-rlp.mjs "$PWD/../../.lake/build/bin/evm-header-rlp" | tee /tmp/header-rlp-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: header-rlp-evidence
          path: |
            /tmp/header-rlp-axioms.txt
            /tmp/header-rlp-claims.json
            /tmp/header-rlp-results.json
