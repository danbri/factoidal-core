name: Independent Lean BLS G2 signature-point admission
on:
  pull_request:
    paths:
      - 'formal/lean4/ethereum-consensus/**'
      - '.github/workflows/ethereum-bls-g2-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: formal/lean4/ethereum-consensus
    env:
      LEAN_NUM_THREADS: '2'
      LEAN_STACK_SIZE_KB: '65536'
      LAKE_ARTIFACT_CACHE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean4/ethereum-consensus
          build: false
          axiom-audit: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Audit exact source pins and oracle controls
        run: |
          set -euo pipefail
          node scripts/check-g2-signature.mjs --self-test | tee "$RUNNER_TEMP/g2-oracle.log"
          python3 - <<'PY' | tee "$RUNNER_TEMP/g2-source-pins.json"
          import json, pathlib, re, subprocess
          paths = ["G2Signature.lean", "G2SignatureMain.lean", "scripts/check-g2-signature.mjs",
                   "lean-toolchain", "lake-manifest.json", "lakefile.toml",
                   "../../../.github/workflows/ethereum-bls-g2-admission.yml"]
          root = pathlib.Path(subprocess.check_output(["git","rev-parse","--show-toplevel"],text=True).strip())
          pins = {}
          for path in paths:
              src = pathlib.Path(path).resolve()
              rel = str(src.relative_to(root))
              blob = subprocess.check_output(["git","hash-object",str(src)],text=True).strip()
              assert blob == subprocess.check_output(["git","rev-parse","HEAD:"+rel],text=True).strip()
              pins[rel] = blob
          source = pathlib.Path("G2Signature.lean").read_text()
          assert re.findall(r"^import\s+(\S+)\s*$",source,re.M) == ["Init"]
          assert not re.search(r"\b(sorry|admit|native_decide|unsafe)\b|^\s*(axiom|partial\s+def)\b|@\[(implemented_by|extern|csimp)",source,re.M)
          assert json.loads(pathlib.Path("lake-manifest.json").read_text())["packages"] == []
          assert pathlib.Path("lean-toolchain").read_text().strip().endswith("v4.33.1")
          print(json.dumps({"head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
                            "tree":subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip(),
                            "source_pins":pins},sort_keys=True))
          PY
      - name: Compile standalone native Lean and capture actual axiom reports
        run: |
          set -euo pipefail
          ulimit -v 8388608
          ulimit -c 0
          lean --version | tee "$RUNNER_TEMP/g2-toolchain.log"
          lean --deps G2Signature.lean | tee "$RUNNER_TEMP/g2-imports.log"
          lean -o "$RUNNER_TEMP/G2Signature.olean" -c "$RUNNER_TEMP/g2.c" G2Signature.lean 2>&1 | tee "$RUNNER_TEMP/g2-axioms.log"
          export LEAN_PATH="$RUNNER_TEMP/"
          lean -c "$RUNNER_TEMP/G2SignatureMain.c" G2SignatureMain.lean
          "$(lean --print-prefix)/bin/leanc" -O2 -o "$RUNNER_TEMP/g2-signature" "$RUNNER_TEMP/g2.c" "$RUNNER_TEMP/G2SignatureMain.c" 2>&1 | tee "$RUNNER_TEMP/g2-native-build.log"
          ldd "$RUNNER_TEMP/g2-signature" | tee "$RUNNER_TEMP/g2-link.log"
          nm -u "$RUNNER_TEMP/g2-signature" | tee "$RUNNER_TEMP/g2-symbols.log"
          if grep -E ' (EVP_|EC_|BN_|blst_|BLS_|mcl_|Hacl_)' "$RUNNER_TEMP/g2-symbols.log"; then exit 1; fi
      - name: Audit exact printed theorem inventory
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          text = (pathlib.Path(os.environ["RUNNER_TEMP"])/"g2-axioms.log").read_text()
          expected = {"EthereumConsensus.BLS.G2."+n for n in
            ("decodeSignature_wrong_width","decodeSignature_candidate_error","checkPoint_ok","checkPoint_bad_subgroup","checkPoint_bad_coordinates","decodeSignature_ok")}
          def audit(t):
              reports = re.findall(r"'(EthereumConsensus\.BLS\.G2\.\w+)' (?:depends on axioms:\s*\[([^]]*)\]|does not depend on any axioms)",t)
              if len(reports)!=len(expected) or {n for n,_ in reports}!=expected:
                  raise ValueError("wrong theorem inventory")
              for n,a in reports:
                  if not set(filter(None,(v.strip() for v in a.split(",")))) <= {"propext","Classical.choice","Quot.sound"}:
                      raise ValueError("unpermitted axiom: "+n)
          audit(text)
          for bad in ["",text+"\n"+text,text.replace("EthereumConsensus.BLS.G2.decodeSignature_ok","EthereumConsensus.BLS.G2.other"),re.sub(r"('EthereumConsensus\.BLS\.G2\.\w+') (?:depends on axioms:\s*\[[^]]*\]|does not depend on any axioms)", r"\1 depends on axioms: [sorryAx]",text,count=1)]:
              try:
                  audit(bad)
              except ValueError:
                  continue
              raise ValueError("audit mutation escaped")
          print("Actual six theorem reports and four falsification controls passed")
          PY
      - name: Compare native signature-point admission against independent affine oracle
        run: |
          set -euo pipefail
          ulimit -v 8388608
          ulimit -c 0
          node scripts/check-g2-signature.mjs "$RUNNER_TEMP/g2-signature" | tee "$RUNNER_TEMP/g2-results.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-g2-signature-evidence
          path: |
            ${{ runner.temp }}/g2-source-pins.json
            ${{ runner.temp }}/g2-oracle.log
            ${{ runner.temp }}/g2-toolchain.log
            ${{ runner.temp }}/g2-imports.log
            ${{ runner.temp }}/g2-axioms.log
            ${{ runner.temp }}/g2-native-build.log
            ${{ runner.temp }}/g2-link.log
            ${{ runner.temp }}/g2-symbols.log
            ${{ runner.temp }}/g2-results.log
