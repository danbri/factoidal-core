name: GDSL common typed dataflow and actual GPU execution
on:
  pull_request:
    paths:
      - 'npm/factoidal/lib/gdsl-*.mjs'
      - 'npm/factoidal/lib/pvgraph-lean-admission.mjs'
      - 'formal/lean4/L4Factoidal/GpuDomainSpecificLanguage/PVGraph.lean'
      - 'tests/gdsl_graph.test.mjs'
      - 'tools/gdsl-graph-device-smoke.mjs'
      - 'tools/pvgraph-native-admission-smoke.mjs'
      - '.github/workflows/check-gdsl-graph.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  gdsl:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
          lake-package-directory: formal/lean4
      - name: Syntax and provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          node --check npm/factoidal/lib/gdsl-graph.mjs
          node --check npm/factoidal/lib/gdsl-webgpu.mjs
          node --check npm/factoidal/lib/pvgraph-lean-admission.mjs
          node --check npm/factoidal/lib/gdsl-examples.mjs
          node --check tools/gdsl-graph-device-smoke.mjs
          node --check tools/pvgraph-native-admission-smoke.mjs
          node --check tests/gdsl_graph.test.mjs
          mkdir -p "$RUNNER_TEMP/gdsl"
          git rev-parse HEAD > "$RUNNER_TEMP/gdsl/commit.txt"
          sha256sum npm/factoidal/lib/gdsl-*.mjs npm/factoidal/lib/pvgraph-lean-admission.mjs tests/gdsl_graph.test.mjs \
            tools/gdsl-graph-device-smoke.mjs tools/pvgraph-native-admission-smoke.mjs |
            tee "$RUNNER_TEMP/gdsl/source.sha256"
      - name: Check canonical graph, JS builder, S-expression and CPU
        run: node --test tests/gdsl_graph.test.mjs
      - name: Build independently executable Lean PVGraph admission and evaluation
        working-directory: formal/lean4
        run: |
          set -euo pipefail
          timeout --kill-after=10s 420s lake build \
            L4Factoidal.GpuDomainSpecificLanguage.PVGraph
      - name: Run native Lean PVGraph admission and anti-forgery tests
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=10s 180s node tools/pvgraph-native-admission-smoke.mjs \
            | tee "$RUNNER_TEMP/gdsl/native-gate.json"
      - name: Install Mesa software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Execute the same five graphs on actual WebGPU
        shell: bash
        run: |
          set -euo pipefail
          driver="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$driver"
          export DENO_WEBGPU_BACKEND=vulkan VK_DRIVER_FILES="$driver"
          export XDG_RUNTIME_DIR
          XDG_RUNTIME_DIR="$(mktemp -d "$RUNNER_TEMP/gdsl-xdg.XXXXXX")"
          timeout --kill-after=10s 240s deno run -A --no-config --no-npm --unstable-webgpu \
            tools/gdsl-graph-device-smoke.mjs "$SOURCE_COMMIT" \
            | tee "$RUNNER_TEMP/gdsl/device.json"
      - name: Save original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdsl-common-graph-device
          path: ${{ runner.temp }}/gdsl/
          retention-days: 30
