name: Independent London header-fee Lean conformance slice

on:
  pull_request:
    paths:
      - "formal/lean4/evm-cleanroom/**"
      - ".github/workflows/evm-london-header.yml"
  workflow_dispatch:

concurrency:
  group: london-headers-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  london-header:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: "1"
      LEAN_STACK_SIZE_KB: "65536"
      MIMALLOC_ARENA_RESERVE: "67108864"
    steps:
      - uses: actions/checkout@v4
      - name: Compile real Lean model and its selected proof obligations
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean4/evm-cleanroom
          build: true
          axiom-audit: true
          axiom-audit-root: EVMCleanroom
      - name: Build standalone London-header executable
        working-directory: formal/lean4
        run: |
          set -euo pipefail
          ulimit -v 8388608
          lake -d evm-cleanroom -f lakefile-london.toml build evm-header-fees 2>&1 | tee /tmp/london-header-build.txt
      - name: Audit actually printed theorem axioms and input guards
        working-directory: formal/lean4
        run: |
          set -euo pipefail
          ulimit -v 8388608
          lake -d evm-cleanroom env lean evm-cleanroom/EVMCleanroom/HeaderFees.lean 2>&1 | tee /tmp/london-header-axioms.txt
          for theorem in nextBaseFee_at_target nextBaseFee_above nextBaseFee_below expected_firstLondon checkHeader_sound missing_parent_refused; do
            grep -q "EVMCleanroom.HeaderFees.$theorem" /tmp/london-header-axioms.txt
          done
          if grep -E '(sorryAx|native_decide|unsafe)' /tmp/london-header-axioms.txt; then
            exit 1
          fi
          python3 evm-cleanroom/scripts/check-london-claims.py --selftest \
            | tee /tmp/london-header-audit-controls.json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["rejected"]==4 and x["sourceDriftRejected"] and x["status"]=="negative-controls-pass", x'
          python3 evm-cleanroom/scripts/check-london-claims.py --report /tmp/london-header-axioms.txt \
            | tee /tmp/london-header-claims.json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["selectedTheorems"]==6 and x["sourceBlobs"]==6 and x["status"]=="printed-axioms-source-pinned", x'
      - name: Execute independent EIP-1559 header reference comparison
        working-directory: formal/lean4/evm-cleanroom
        run: |
          set -euo pipefail
          python3 scripts/check-london-header-fees.py --generate /tmp/london-input.tsv /tmp/london-expected.jsonl
          .lake/build/bin/evm-header-fees --batch /tmp/london-input.tsv > /tmp/london-observed.jsonl
          python3 scripts/check-london-header-fees.py --check /tmp/london-expected.jsonl /tmp/london-observed.jsonl \
            | tee /tmp/london-header-results.json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="native-oracle-match" and x["cases"]==1555 and x["mismatches"]==x["notRun"]==0 and x["mutationControls"]==3 and x["seed"]==1559,x'
      - name: Invalid-transport guard
        working-directory: formal/lean4/evm-cleanroom
        run: |
          set -euo pipefail
          printf 'invalid\t30000000\t15000000\t1000000000\t30000000\t0\t1000000000\n' >/tmp/london-malformed.tsv
          if .lake/build/bin/evm-header-fees --batch /tmp/london-malformed.tsv >/tmp/london-malformed-out.jsonl; then
            echo "Malformed input incorrectly accepted"
            exit 1
          fi
          python3 -c 'import json; r=json.load(open("/tmp/london-malformed-out.jsonl")); assert r["status"]=="inputError",r'
      - name: No new implementation package
        working-directory: formal/lean4/evm-cleanroom
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("lake-manifest.json").read_text())
          assert manifest.get("packages", []) == [], manifest
          for p in ("EVMCleanroom/HeaderFees.lean", "EVMCleanroom/HeaderFeeCLI.lean"):
              text = Path(p).read_text()
              assert "EthLib" not in text and "extern" not in text
          print("No added Lake packages, FFI or external implementation imports")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: london-header-evidence
          path: |
            /tmp/london-header-build.txt
            /tmp/london-header-axioms.txt
            /tmp/london-header-audit-controls.json
            /tmp/london-header-claims.json
            /tmp/london-header-results.json
            /tmp/london-malformed-out.jsonl
