name: Lean beacon SSZ generalized-index and LMD latest-message foundations

on:
  pull_request:
    paths:
      - "formal/lean4/ethereum-consensus/**"
      - ".github/workflows/ethereum-consensus.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ethereum-consensus-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ssz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile Lean 4.33.1 definitions, guards and axiom audit
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean4/ethereum-consensus
          build: true
          axiom-audit: true
          axiom-audit-root: EthereumConsensus
      - name: Re-run exact theorem files through Lean for printed axiom evidence
        working-directory: formal/lean4/ethereum-consensus
        run: |
          lake env lean EthereumConsensus/SSZ/GIndex.lean
          lake env lean EthereumConsensus/SSZ/CheckedBranch.lean
          lake env lean EthereumConsensus/SSZ/MultiProofHelpers.lean
          lake env lean EthereumConsensus/ForkChoice/LatestMessage.lean
          lake env lean EthereumConsensus/ForkChoice/VoteStore.lean
          lake env lean EthereumConsensus/ForkChoice/AttestationScore.lean
          lake env lean EthereumConsensus/ForkChoice/ProposerScore.lean
          lake env lean EthereumConsensus/ForkChoice/CheckedAncestry.lean
          lake env lean EthereumConsensus/ForkChoice/ChildSelection.lean
          lake env lean EthereumConsensus/ForkChoice/StoredHead.lean
      - name: Independent SSZ generalized-index reference over 1025 inputs
        shell: bash
        working-directory: formal/lean4/ethereum-consensus
        run: |
          set -euo pipefail
          lake exe ssz-gindex | python3 scripts/check-gindex.py
      - name: Independent checked SSZ branch policy and fold (1025 inputs)
        shell: bash
        working-directory: formal/lean4/ethereum-consensus
        run: |
          set -euo pipefail
          lake exe ssz-checked-branch | python3 scripts/check-checked-branch.py
      - name: Independent LMD latest-message reference over 2048 inputs
        shell: bash
        working-directory: formal/lean4/ethereum-consensus
        run: |
          set -euo pipefail
          lake exe lmd-latest | python3 scripts/check-lmd-latest.py
      - name: Independent guarded vote-store sequential trace (1024 rows)
        shell: bash
        working-directory: formal/lean4/ethereum-consensus
        run: |
          set -euo pipefail
          lake exe lmd-store | python3 scripts/check-lmd-store.py
      - name: Independent LMD attestation score and proposer boost (1024 rows)
        shell: bash
        working-directory: formal/lean4/ethereum-consensus
        run: |
          set -euo pipefail
          lake exe lmd-score | python3 scripts/check-attestation-score.py
      - name: Independent two-stage proposer score and LMD bridge (1024 rows)
        shell: bash
        working-directory: formal/lean4/ethereum-consensus
        run: |
          set -euo pipefail
          lake exe lmd-computed-boost | python3 scripts/check-proposer-score.py
      - name: Independent bounded ancestry and LMD checked score (1024 rows)
        shell: bash
        working-directory: formal/lean4/ethereum-consensus
        run: |
          set -euo pipefail
          lake exe lmd-checked-ancestry | python3 scripts/check-ancestry.py
      - name: Independent fail-closed weighted child selector (1024 rows)
        shell: bash
        working-directory: formal/lean4/ethereum-consensus
        run: |
          set -euo pipefail
          lake exe lmd-checked-child | python3 scripts/check-child-selection.py
      - name: Independent finite-inventory bounded get_head (1024 rows)
        shell: bash
        working-directory: formal/lean4/ethereum-consensus
        run: |
          set -euo pipefail
          lake exe lmd-stored-head | python3 scripts/check-stored-head.py
      - name: Independent bounded SSZ multiproof helper indices (2048 rows)
        shell: bash
        working-directory: formal/lean4/ethereum-consensus
        run: |
          set -euo pipefail
          lake exe ssz-multiproof-helpers | python3 scripts/check-multiproof-helpers.py
