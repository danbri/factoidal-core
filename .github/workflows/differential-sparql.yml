name: Differential SPARQL and RDF readers (Factoidal against Oxigraph)

# P7 of batch https://github.com/danbri/factoidal-core/issues/1189:
# https://github.com/danbri/factoidal-core/issues/1184 (random differential campaigns).
# Seeded random graphs and SELECT/ASK queries; the published @factoidal/core
# (latest) and pyoxigraph answer each one; the summary states "agrees on N of M".
# Disagreements are uploaded as cases to keep. The job fails only when the
# harness fails, not on a disagreement: the rate is the measurement.
on:
  workflow_dispatch:
    inputs:
      n:
        description: number of cases
        default: '5000'
      seed:
        description: 'generator seed (default is the run number)'
        default: ''
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/diffcampaign/**'
      - '.github/workflows/differential-sparql.yml'

permissions:
  contents: read

concurrency:
  group: differential-sparql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engines
        run: |
          python3 -m pip install --quiet pyoxigraph
          mkdir -p "$RUNNER_TEMP/fd" && cd "$RUNNER_TEMP/fd" && npm init -y >/dev/null && npm install --silent @factoidal/core@latest
          node -e 'console.log("factoidal", require(process.argv[1]+"/node_modules/@factoidal/core/package.json").version)' "$RUNNER_TEMP/fd" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -c 'import pyoxigraph; print("pyoxigraph", pyoxigraph.__version__)' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Generate, answer, compare
        env:
          N: ${{ github.event.inputs.n || '5000' }}
          SEED: ${{ github.event.inputs.seed || github.run_number }}
        run: |
          set -o pipefail
          T="$RUNNER_TEMP"
          python3 tools/diffcampaign/sparql.py gen --seed "$SEED" --n "$N" --out "$T/cases.jsonl"
          python3 tools/diffcampaign/sparql.py oxigraph "$T/cases.jsonl" --out "$T/ox.jsonl"
          node tools/diffcampaign/sparql-factoidal.mjs "$T/cases.jsonl" "$T/fd.jsonl" "$T/fd/node_modules/@factoidal/core/index.mjs"
          echo "npm @factoidal/core (latest):" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/diffcampaign/sparql.py compare "$T/cases.jsonl" "$T/ox.jsonl" "$T/fd.jsonl" --keep "$T/disagreements" --json "$T/summary.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "seed $SEED" >> "$GITHUB_STEP_SUMMARY"
          # The newest web build of a main ancestor (danbri/factoidal-builds), so a fix shows
          # before it is released. A missing build is reported, not a failure.
          if GH_TOKEN="${{ github.token }}" bash tools/fetch-builds.sh --set web > "$T/fetch.log" 2>&1; then
            echo "web build of main ($(grep -oE 'build-[0-9a-f]{12}-web' "$T/fetch.log" | head -1)):" | tee -a "$GITHUB_STEP_SUMMARY"
            node tools/diffcampaign/sparql-factoidal.mjs "$T/cases.jsonl" "$T/fdm.jsonl" "$PWD/npm/factoidal/index.mjs"
            python3 tools/diffcampaign/sparql.py compare "$T/cases.jsonl" "$T/ox.jsonl" "$T/fdm.jsonl" --keep "$T/disagreements-main" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "no web build of main fetched" | tee -a "$GITHUB_STEP_SUMMARY"; tail -5 "$T/fetch.log"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sparql-differential
          path: |
            ${{ runner.temp }}/summary.json
            ${{ runner.temp }}/disagreements
            ${{ runner.temp }}/disagreements-main
            ${{ runner.temp }}/both-refused

  turtle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Readers
        run: |
          python3 -m pip install --quiet pyoxigraph
          mkdir -p "$RUNNER_TEMP/fd" && cd "$RUNNER_TEMP/fd" && npm init -y >/dev/null && npm install --silent @factoidal/core@latest
      - name: Generate, read, compare (Turtle, TriG, RDF/XML, N-Triples, N-Quads)
        env:
          N: ${{ github.event.inputs.n || '5000' }}
          SEED: ${{ github.event.inputs.seed || github.run_number }}
        run: |
          set -o pipefail
          T="$RUNNER_TEMP"
          MAIN_OK=0; GH_TOKEN="${{ github.token }}" bash tools/fetch-builds.sh --set web > "$T/fetch.log" 2>&1 && MAIN_OK=1
          for fmt in turtle trig rdfxml nt nquads; do
            if [ "$fmt" = rdfxml ]; then
              python3 tools/diffcampaign/rdfxml.py --seed "$SEED" --n "$N" --out "$T/$fmt-cases.jsonl"
            else
              python3 tools/diffcampaign/turtle.py gen --seed "$SEED" --n "$N" --format "$fmt" --out "$T/$fmt-cases.jsonl"
            fi
            python3 tools/diffcampaign/turtle.py oxigraph "$T/$fmt-cases.jsonl" --out "$T/$fmt-ox.jsonl"
            echo "npm @factoidal/core (latest), $fmt:" | tee -a "$GITHUB_STEP_SUMMARY"
            node tools/diffcampaign/turtle-factoidal.mjs "$T/$fmt-cases.jsonl" "$T/$fmt-ox.jsonl" "$T/fd/node_modules/@factoidal/core/index.mjs" --keep "$T/turtle-disagreements/$fmt" --json "$T/turtle-summary-$fmt.json" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$MAIN_OK" = 1 ]; then
              echo "web build of main ($(grep -oE 'build-[0-9a-f]{12}-web' "$T/fetch.log" | head -1)), $fmt:" | tee -a "$GITHUB_STEP_SUMMARY"
              node tools/diffcampaign/turtle-factoidal.mjs "$T/$fmt-cases.jsonl" "$T/$fmt-ox.jsonl" "$PWD/npm/factoidal/index.mjs" --keep "$T/turtle-disagreements-main/$fmt" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          [ "$MAIN_OK" = 1 ] || { echo "no web build of main fetched" | tee -a "$GITHUB_STEP_SUMMARY"; tail -5 "$T/fetch.log"; }
          echo "seed $SEED" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turtle-differential
          path: |
            ${{ runner.temp }}/turtle-summary-*.json
            ${{ runner.temp }}/turtle-disagreements
            ${{ runner.temp }}/turtle-disagreements-main
