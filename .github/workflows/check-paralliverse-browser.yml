name: Paralliverse browser acceptance

on:
  pull_request:
    paths:
      - 'docs/web/hub/paralliverse/**'
      - 'docs/web/hub/gdsl-app/**'
      - 'docs/.eleventy.js'
      - 'npm/factoidal/**'
      - 'tools/check-web-runtime-compat.py'
      - 'tests/test_web_runtime_compat.py'
      - 'tests/web-demos/gdsl_app_browser.mjs'
      - 'tools/pvgraph-evidence-provenance.mjs'
      - 'tools/paralliverse-browser-smoke.mjs'
      - '.github/workflows/check-paralliverse-browser.yml'
  workflow_dispatch:
    inputs:
      core_ref:
        description: Core ref whose runtime inputs match a published web release
        required: true
        type: string
        default: main

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.core_ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Run applicable premerge checks
        shell: bash
        run: tools/premerge.sh --changed --base origin/main

      - name: Test runtime compatibility acceptance and refusals
        run: python3 tests/test_web_runtime_compat.py

      - name: Record the exact page source
        shell: bash
        env:
          EVIDENCE: ${{ runner.temp }}/paralliverse-browser-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          printf 'EVIDENCE=%s\n' "$EVIDENCE" >> "$GITHUB_ENV"
          git rev-parse HEAD | tee "$EVIDENCE/commit.txt"
          node --version | tee "$EVIDENCE/node-version.txt"
          sha256sum docs/.eleventy.js docs/_includes/hub-app.njk \
            docs/web/hub/paralliverse/{index.njk,style.css,app.mjs,execution-stepper.mjs,bgp-fixtures.mjs,bgp-worker.mjs,bgp-studio.mjs,bgp-comparison.mjs,integer-bgp-gpu.mjs,integer-bgp-compact-gpu.mjs,worker.mjs,gpu.mjs,word-gpu.mjs} \
            tools/paralliverse-browser-smoke.mjs | tee "$EVIDENCE/source.sha256"

      - name: Install and verify the compatible published web release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Releases publish from main only. Check the actual runtime producers
          # separately from current host source, which this job builds and tests.
          # fetch-builds still verifies the archive and every manifested file.
          tools/fetch-builds.sh --set web 2>&1 | tee "$EVIDENCE/fetch-web.log"
          manifest=docs/web/hub/assets/l4/paralliverse/manifest.json
          if [ ! -s "$manifest" ]; then
            echo "The installed web release has no Paralliverse runtime manifest." >&2
            exit 1
          fi
          cp "$manifest" "$EVIDENCE/manifest.json"
          cp .factoidal-builds/web.tag "$EVIDENCE/web-release.txt"
          cp .factoidal-builds/web.build-info.json "$EVIDENCE/web.build-info.json"
          python3 tools/check-web-runtime-compat.py --evidence "$EVIDENCE/runtime-compatibility.json"

      - name: Install the scene runtimes used by Pages
        if: ${{ hashFiles('docs/web/hub/html-webgpu/index.njk', 'docs/web/hub/svg-webgpu/index.njk') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools/fetch-builds.sh --set foafnaut-web 2>&1 | tee "$EVIDENCE/fetch-foafnaut-web.log"

      - name: Install Eleventy from the vendored cache
        shell: bash
        run: |
          set -euo pipefail
          third_party/eleventy/install.sh docs 2>&1 | tee "$EVIDENCE/eleventy-install.log"

      - name: Build the Pages checkout for browser testing
        working-directory: docs
        shell: bash
        run: |
          set -euo pipefail
          npx --offline @11ty/eleventy --quiet --output=_site 2>&1 | tee "$EVIDENCE/eleventy-build.log"
          test -s _site/web/hub/paralliverse/index.html
          cmp web/hub/assets/l4/paralliverse/manifest.json _site/web/hub/assets/l4/paralliverse/manifest.json

      - name: Verify the rendered current host and released runtime bytes
        run: |
          python3 tools/check-web-runtime-compat.py --site docs/_site \
            --evidence "$EVIDENCE/runtime-compatibility.json"

      - name: Check the compiled Wasm and Chrome WebGPU results
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=10s 420s node tools/paralliverse-browser-smoke.mjs \
            docs/_site "$EVIDENCE" "$(cat "$EVIDENCE/commit.txt")" 2>&1 | tee "$EVIDENCE/smoke.log"

      - name: Check the GDSL app with the verified compatible release
        shell: bash
        run: |
          set -euo pipefail
          # Runtime input identity and current rendered host hashes were checked
          # above. The independent full-Wasm lane still rebuilds the exact source.
          npm install --prefix "$RUNNER_TEMP/gdsl-browser-tools" \
            --ignore-scripts --no-audit --no-fund --save-exact playwright@1.62.1 \
            2>&1 | tee "$EVIDENCE/gdsl-playwright-install.log"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/gdsl-browser-binaries"
          "$RUNNER_TEMP/gdsl-browser-tools/node_modules/.bin/playwright" \
            install --with-deps chromium 2>&1 | tee "$EVIDENCE/gdsl-chromium-install.log"
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/gdsl-browser-tools/node_modules/playwright/index.mjs"
          timeout --kill-after=10s 240s node tests/web-demos/gdsl_app_browser.mjs \
            --report "$EVIDENCE/gdsl-app-browser.json" \
            --screenshots "$EVIDENCE/gdsl-browser-screenshots" \
            2>&1 | tee "$EVIDENCE/gdsl-app-browser.log"

      - name: Preserve browser acceptance records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paralliverse-browser-evidence
          path: ${{ runner.temp }}/paralliverse-browser-evidence
          if-no-files-found: warn
          retention-days: 30
