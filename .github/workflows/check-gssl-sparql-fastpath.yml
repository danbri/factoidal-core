        L4Factoidal.GpuDomainSpecificLanguage.RdfCanonicalCodec.admitted_eqb_for_codes
        L4Factoidal.GpuDomainSpecificLanguage.RdfCanonicalCodec.admitted_equality
        L4Factoidal.GpuDomainSpecificLanguage.RdfCanonicalCodec.checkGraphRoundTrip_sound
        L4Factoidal.GpuDomainSpecificLanguage.RdfCanonicalCodec.checkBindingRoundTrip_sound
