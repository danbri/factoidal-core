name: GSSL SPARQL fast-path contract
on:
  pull_request:
    paths:
      - 'formal/lean4/L4Factoidal/SPARQL/**'
      - 'formal/lean4/L4Factoidal/GpuDomainSpecificLanguage/**'
      - '.github/workflows/check-gssl-sparql-fastpath.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  contract:
    uses: ./.github/workflows/check-dataflow-stage.yml
    with:
      group: gssl-sparql-fastpath
      timeout_minutes: 20
      modules: >-
        L4Factoidal.SPARQL.GsslFastPath L4Factoidal.SPARQL.GsslFastPathTests
        L4Factoidal.SPARQL.GsslBgpRefinement
        L4Factoidal.SPARQL.GsslCertifiedFastPath
        L4Factoidal.SPARQL.GsslSnapshotLease
        L4Factoidal.GpuDomainSpecificLanguage.EncodedJoin
        L4Factoidal.GpuDomainSpecificLanguage.RdfTermCodebook
        L4Factoidal.SPARQL.GsslEncodedBgpRefinement
        L4Factoidal.SPARQL.PvGraphBgpLowering
        L4Factoidal.SPARQL.PvGraphHybridPlacement
        L4Factoidal.Dataflow.XmlSourceGraphStage
        L4Factoidal.GpuDomainSpecificLanguage.RdfCanonicalCodec
        L4Factoidal.GpuDomainSpecificLanguage.Sbm11U64Lanes
      theorems: >-
        L4Factoidal.SPARQL.GsslFastPath.resolve_eq_indexed
        L4Factoidal.SPARQL.GsslFastPath.unsupported_fallback
        L4Factoidal.SPARQL.GsslFastPath.missing_fallback
        L4Factoidal.SPARQL.GsslBgpRefinement.rdfPlan_eq_evalBgpIdx
        L4Factoidal.SPARQL.GsslBgpRefinement.resolve_rdfPlan
        L4Factoidal.SPARQL.GsslBgpRefinement.rightMatch_eq_tpMatch
        L4Factoidal.SPARQL.GsslBgpRefinement.rightSelect_eq_evalTP
        L4Factoidal.SPARQL.GsslBgpRefinement.relationalPlan_eq_rdfPlan
        L4Factoidal.SPARQL.GsslBgpRefinement.relationalPlan_eq_evalBgpIdx
        L4Factoidal.SPARQL.GsslCertifiedFastPath.resolve_eq_indexed
        L4Factoidal.SPARQL.GsslCertifiedFastPath.certifiedRdfPlan_eq_indexed
        L4Factoidal.SPARQL.GsslSnapshotLease.fresh_accept
        L4Factoidal.SPARQL.GsslSnapshotLease.stale_refused
        L4Factoidal.SPARQL.GsslSnapshotLease.missing_refused
        L4Factoidal.SPARQL.GsslSnapshotLease.resolveGuarded_eq_indexed
        L4Factoidal.SPARQL.GsslSnapshotLease.stale_fallback
        L4Factoidal.GpuDomainSpecificLanguage.EncodedJoin.rowMatches_encode
        L4Factoidal.GpuDomainSpecificLanguage.EncodedJoin.joinRows_encode
        L4Factoidal.GpuDomainSpecificLanguage.EncodedJoin.checkAgreement_sound
        L4Factoidal.GpuDomainSpecificLanguage.EncodedJoin.joinRows_encode_checked
        L4Factoidal.GpuDomainSpecificLanguage.RdfTermCodebook.join_eq_of_check
        L4Factoidal.SPARQL.GsslEncodedBgpRefinement.rdfJoin_eq_relationalPlan
        L4Factoidal.SPARQL.GsslEncodedBgpRefinement.encodedJoin_eq_evalBgpIdx
        L4Factoidal.SPARQL.PvGraphBgpLowering.word_xor_zero_iff
        L4Factoidal.SPARQL.PvGraphBgpLowering.reconstruct_differences
        L4Factoidal.SPARQL.PvGraphBgpLowering.pvgraph_zipXor_matches_model
        L4Factoidal.SPARQL.PvGraphBgpLowering.matches_eq_encodedJoin
        L4Factoidal.SPARQL.PvGraphBgpLowering.reconstructed_eq_indexed
        L4Factoidal.SPARQL.PvGraphBgpLowering.reconstructed_eq_evalIn
        L4Factoidal.SPARQL.PvGraphBgpLowering.reconstructed_eq_namedGraph
        L4Factoidal.SPARQL.PvGraphBgpLowering.namedDecoded_eq_graphVariable
        L4Factoidal.SPARQL.PvGraphBgpLowering.Prepared.correct
        L4Factoidal.SPARQL.PvGraphHybridPlacement.run_eq_indexed
        L4Factoidal.SPARQL.PvGraphHybridPlacement.chosen_eq_indexed
        L4Factoidal.SPARQL.PvGraphHybridPlacement.runWithLease_eq_indexed
