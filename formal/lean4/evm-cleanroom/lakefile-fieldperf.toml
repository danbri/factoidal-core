name = "evm_cleanroom"
version = "0.1.0"
defaultTargets = ["EVMCleanroom"]

# Differential guard and timing of the limb fields, and the precompile runner
# for the vector runs of the fast paths. Its own configuration, so the reviewed
# ones stay unchanged.
[[lean_lib]]
name = "EVMCleanroom"

[[lean_exe]]
name = "evm-fieldperf"
root = "EVMCleanroom.FieldPerf.Main"
moreLeancArgs = ["-O3"]

[[lean_exe]]
name = "evm-precompile"
root = "EVMCleanroom.PrecompileCLI"
moreLeancArgs = ["-O3"]

# Differential check and timing of the pairing checks on the limb tower, and
# the old path in the format of `evm-precompile --bench`.
[[lean_exe]]
name = "evm-pairingperf"
root = "EVMCleanroom.PairingPerf.Main"
moreLeancArgs = ["-O3"]

# Differential check and timing of the group-operation precompiles on limbs
# (alt_bn128 add and mul, BLS12-381 add, multi-scalar multiplication, map,
# subgroup checks) against their Nat definitions.
[[lean_exe]]
name = "evm-blsops"
root = "EVMCleanroom.FieldPerf.BlsOps"
moreLeancArgs = ["-O3"]

# BLS signature verification (Precompiles/BLSSignature.lean): RFC 9380 vectors,
# differential run against the Nat definitions, published vectors, timing, and
# the command line used for cross-checks from other packages.
[[lean_exe]]
name = "evm-blssig"
root = "EVMCleanroom.BLSSig.Main"
moreLeancArgs = ["-O3"]
