name = "evm_cleanroom"
version = "0.1.0"
defaultTargets = ["EVMCleanroom"]
moreLeancArgs = ["-Dlean_initialize=lean_initialize_runtime_module"]

[[lean_lib]]
name = "EVMCleanroom"

# The repository's pure SHA-256 (no imports beyond Init), shared by source
# with the consensus package. Used by precompiles 0x02 and 0x0a.
[[lean_lib]]
name = "FactoidalSHA2"
srcDir = ".."
roots = ["L4Factoidal.Crypto.SHA2", "L4Factoidal.Crypto.SHA2Theorems"]

[[lean_exe]]
name = "evm-raw-signed"
root = "EVMCleanroom.SignedTransactionCLI"

[[lean_exe]]
name = "evm-transaction-list"
root = "EVMCleanroom.TransactionListCLI"
